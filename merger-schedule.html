<title>통합 추진 일정판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --navy:#17458C; --navy-2:#0F3269; --green:#00A650;
  --paper:#EDF1F5; --surface:#ffffff; --surface-2:#E5EDF8; --surface-3:#F5F8FC; --canvas:#F1F4F8;
  --ink:#1B2534; --ink-2:#4A586B; --ink-3:#8290A3;
  --line:#D8DEE6; --line-2:#BFC9D6;
  --accent:#1668C1; --accent-ink:#0F4E96; --accent-soft:#E3EDF9; --on-accent:#ffffff;
  --todo:#6B7A8D; --doing:#B26A00; --done:#1E7A4A; --late:#C0392B; --hold:#6B5B95;
  --p1:#17458C; --p2:#1668C1; --p3:#0E7C86; --p4:#00834B; --p5:#7E7A1C; --p6:#B26A00; --p7:#B0392B;
  --edge:#8494A8; --band-tint:rgba(23,69,140,.05); --note-bg:#FFF3BF; --note-ink:#3A3212;
  --shadow:0 1px 2px rgba(23,69,140,.06);
  --sans:"Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:var(--sans);
  --mono:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#12315F; --navy-2:#0C2447; --green:#12B45E;
    --paper:#0F141A; --surface:#161C24; --surface-2:#1E2833; --surface-3:#131A21; --canvas:#0D1319;
    --ink:#E4E9EF; --ink-2:#A7B4C4; --ink-3:#7A8899;
    --line:#2A3542; --line-2:#3B4857;
    --accent:#4E9BE8; --accent-ink:#8FC2F2; --accent-soft:#152A40; --on-accent:#07121D;
    --todo:#8B9AAC; --doing:#E0A54A; --done:#5BC48D; --late:#E8877C; --hold:#A99BD0;
    --p1:#4B85D6; --p2:#54A6EE; --p3:#3FAEB6; --p4:#3BB578; --p5:#B6B048; --p6:#DD9A45; --p7:#DE7566;
    --edge:#66788C; --band-tint:rgba(255,255,255,.04); --note-bg:#4B4420; --note-ink:#F2E8C6;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
--navy:#12315F; --navy-2:#0C2447; --green:#12B45E;
  --paper:#0F141A; --surface:#161C24; --surface-2:#1E2833; --surface-3:#131A21; --canvas:#0D1319;
  --ink:#E4E9EF; --ink-2:#A7B4C4; --ink-3:#7A8899;
  --line:#2A3542; --line-2:#3B4857;
  --accent:#4E9BE8; --accent-ink:#8FC2F2; --accent-soft:#152A40; --on-accent:#07121D;
  --todo:#8B9AAC; --doing:#E0A54A; --done:#5BC48D; --late:#E8877C; --hold:#A99BD0;
  --p1:#4B85D6; --p2:#54A6EE; --p3:#3FAEB6; --p4:#3BB578; --p5:#B6B048; --p6:#DD9A45; --p7:#DE7566;
  --edge:#66788C; --band-tint:rgba(255,255,255,.04); --note-bg:#4B4420; --note-ink:#F2E8C6;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
.appbar{background:var(--navy);color:#fff}
.appbar-in{max-width:1480px;margin:0 auto;padding:0 18px;height:46px;display:flex;align-items:center;
  justify-content:space-between;gap:14px}
.appbar .brand{display:flex;align-items:center;gap:9px;min-width:0}
.appbar .mk{width:15px;height:15px;background:var(--green);border-radius:2px;flex:0 0 auto}
.appbar .org{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.appbar .sys{font-size:13px;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-r{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-size:12px}
.appbar-r .dt{opacity:.85;font-variant-numeric:tabular-nums}
.appbar-r button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.32);color:#fff;
  border-radius:2px;padding:3px 11px;cursor:pointer;font-size:12px}
.appbar-r button:hover{background:rgba(255,255,255,.24)}
.greenline{height:3px;background:var(--green)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:1480px;margin:0 auto;padding-inline:18px;padding-block:16px 44px;display:flex;flex-direction:column;gap:13px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.masthead{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--navy);padding-bottom:9px}
.eyebrow{margin:0 0 3px;font-size:11.5px;color:var(--ink-3)}
.masthead h1{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--navy-2)}
.masthead h1::before{content:"";display:inline-block;width:4px;height:15px;background:var(--navy);
  margin-right:7px;vertical-align:-1px;border-radius:1px}
.masthead .sub{margin:5px 0 0;color:var(--ink-2);max-width:74ch;font-size:12.5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:9px 12px 8px;
  display:flex;flex-direction:column;gap:2px}
.stat .t{font-size:12px;color:var(--ink);font-weight:500}
.stat .n{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--accent);letter-spacing:-.02em}
.stat .c{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stat.is-warnk .n,.stat.is-late .n{color:var(--late)}
.stat.is-doing .n{color:var(--doing)} .stat.is-done .n{color:var(--done)}
.stat.is-dday .n{color:var(--navy)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:inline-flex;gap:3px}
.tabs button{border:1px solid var(--line-2);border-bottom-color:var(--line-2);background:var(--surface-3);
  padding:6px 16px;cursor:pointer;color:var(--ink-2);font-weight:500;border-radius:2px 2px 0 0;font-size:12.5px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--navy-2);font-weight:700;
  border-top:2px solid var(--accent);padding-top:5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type="text"],input[type="date"],input[type="search"],textarea{
  font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:2px;padding:5px 8px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
input[type="search"]{min-width:150px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:6px 14px;border-radius:2px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2);font-weight:500}
.btn:hover{filter:brightness(1.07)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:2px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.note{border:1px solid var(--accent);border-left-width:3px;background:var(--accent-soft);color:var(--accent-ink);padding:8px 12px;font-size:12.5px;border-radius:0 2px 2px 0}
.note[hidden]{display:none!important}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:8px 13px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.panel-head h2{font-size:14px;font-weight:700;color:var(--navy-2)}
.panel-head h2::before{content:"";display:inline-block;width:3px;height:12px;background:var(--navy);
  margin-right:6px;vertical-align:-1px}
.panel-head .hint{font-size:12px;color:var(--ink-3)}
.zoom{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:3px 10px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line);font-size:12px}
.zoom button:last-child{border-right:0}
.zoom button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}

/* ---------- 캔버스 ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.scroller{position:relative;overflow:auto;max-height:min(70vh,660px);background:var(--canvas);
  border-right:1px solid var(--line);overscroll-behavior:contain}
.ruler{position:sticky;top:0;z-index:6;height:34px;display:flex;background:var(--surface-2);
  border-bottom:1px solid var(--line-2);width:max-content;min-width:100%}
.ruler .mo{flex:0 0 auto;border-left:1px solid var(--line-2);padding:3px 0 0 5px;font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;line-height:1.25}
.ruler .mo:first-child{border-left:0}
.ruler .mo .y{display:block;font-size:9.5px;color:var(--ink-3);letter-spacing:.06em}
.surface{position:relative;touch-action:none;cursor:crosshair}
.sticky{position:absolute;width:172px;z-index:6;border:1px solid rgba(0,0,0,.16);border-radius:2px;
  box-shadow:0 3px 11px -3px rgba(0,0,0,.35);transform:rotate(-.7deg);display:flex;flex-direction:column}
.sticky.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:9;transform:rotate(0deg)}
.sticky .pin{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:9px;height:9px;
  border-radius:50%;background:rgba(0,0,0,.32);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.sticky{cursor:grab;touch-action:none}
.sticky:active{cursor:grabbing}
.sticky .bd{padding:8px 10px 10px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
  min-height:34px;max-height:112px;overflow:hidden}
.sticky .bd.ph{opacity:.5;font-style:italic}
.sticky:hover{box-shadow:0 5px 14px -4px rgba(0,0,0,.45)}
.sticky.min{width:30px;height:30px;border-radius:3px;transform:rotate(0deg);
  box-shadow:0 2px 6px -2px rgba(0,0,0,.4)}
.sticky.min .ico{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.sticky.min .ico svg{display:block;pointer-events:none}
.sticky.min .pin{top:-4px;width:7px;height:7px}
.sticky.min:hover{box-shadow:0 3px 10px -2px rgba(0,0,0,.5)}
.band{position:absolute;left:0;pointer-events:none;z-index:1;border-top:1px solid var(--line)}
.band.alt{background:var(--band-tint)}
.band .bl{position:sticky;left:8px;display:inline-block;margin-top:-10px;white-space:nowrap;
  font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line-2);border-left:3px solid var(--line-2);border-radius:2px;padding:1px 9px}
.vgrid{position:absolute;inset:0;pointer-events:none;z-index:2}
.vgrid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.vgrid i.q{background:var(--line-2)}
.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--late);pointer-events:none;z-index:4}
.nowline b{position:absolute;top:2px;left:5px;white-space:nowrap;font-size:10px;font-weight:700;color:var(--late);background:var(--surface);padding:0 4px;border-radius:2px}
.edges{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3}
.edges path.e{fill:none;stroke:var(--edge);stroke-width:1.9;pointer-events:stroke;cursor:pointer}
.edges path.e:hover{stroke:var(--ink);stroke-width:2.6}
.edges path.e.bad{stroke:var(--late);stroke-dasharray:5 3;stroke-width:2}
.edges path.tmp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}

.node{position:absolute;height:46px;border-radius:2px;border:1px solid rgba(0,0,0,.16);
  display:flex;flex-direction:column;justify-content:center;padding:0 9px;gap:1px;
  color:var(--on-accent);cursor:grab;touch-action:none;z-index:5;
  box-shadow:0 1px 2px rgba(0,0,0,.18);background-clip:padding-box}
.node:active{cursor:grabbing}
.node .t{font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.node .m{font-size:10.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.node.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:7}
.node.st-done{opacity:.58}
.node.st-todo{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px)}
.node.st-hold{filter:grayscale(.65)}
.node.bad{border-color:var(--late);box-shadow:0 0 0 2px var(--late)}
.node.slim{padding:0}
.node .hL,.node .hR{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none}
.node .hL{left:0} .node .hR{right:0}
.node .link{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  border-radius:50%;background:var(--surface);border:2px solid var(--edge);cursor:crosshair;z-index:8;
  touch-action:none;opacity:.55}
.node:hover .link,.node.sel .link,.node:focus-within .link{opacity:1}
.node .link:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-50%) scale(1.15)}
.node.sel .link{border-color:var(--ink)}
.tagout{position:absolute;height:46px;display:flex;flex-direction:column;justify-content:center;
  font-size:11px;line-height:1.25;color:var(--ink-2);white-space:nowrap;pointer-events:none;z-index:5}
.tagout b{font-weight:600;color:var(--ink)}
.tagout span{font-size:10px;color:var(--ink-3)}
.newspan{position:absolute;height:46px;border:2px dashed var(--accent);background:var(--accent-soft);
  opacity:.85;border-radius:2px;pointer-events:none;z-index:9;display:flex;align-items:center;
  padding:0 8px;font-size:11px;font-weight:500;color:var(--accent-ink);overflow:hidden}
.drophint{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:8;pointer-events:none;
  color:var(--ink-3);font-size:13px;text-align:center;line-height:1.7}
.drophint b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink-2);margin-bottom:2px}

/* 인스펙터 */
.insp{padding:14px;display:flex;flex-direction:column;gap:11px;overflow:auto;max-height:min(70vh,660px)}
.insp .none{color:var(--ink-3);font-size:13px;line-height:1.7}
.insp .none b{display:block;font-size:13px;font-weight:700;color:var(--navy-2);margin-bottom:4px}
.insp .f{display:flex;flex-direction:column;gap:3px}
.insp label{font-size:11px;letter-spacing:.05em;color:var(--ink-2);font-weight:600}
.insp input,.insp select,.insp textarea{width:100%;font-size:13px}
.insp textarea{resize:vertical;min-height:48px}
.insp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp h3{font-size:13px;font-weight:700;color:var(--navy-2);background:var(--surface-2);border:1px solid var(--line-2);margin:-14px -14px 2px;padding:7px 13px}
.deplist{display:flex;flex-direction:column;gap:4px}
.deplist .d{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--surface-3);
  border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.deplist .d span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deplist .d button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.deplist .d button:hover{color:var(--late)}
.deplist .warn{color:var(--late);font-size:11.5px;font-weight:500}
.deplist .empty{color:var(--ink-3);font-size:12px}
.danger{border:1px solid var(--late);color:var(--late);background:var(--surface);border-radius:2px;padding:5px 12px;cursor:pointer;font-size:12.5px}

/* 표 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:840px;font-size:13px}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--navy-2);font-weight:700;background:var(--surface-2);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line-2)}
tbody tr:hover{background:var(--surface-3)}
td.date{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
td .task-t{font-weight:600}
td .task-n{color:var(--ink-3);font-size:12px;margin-top:2px}
td .task-w{color:var(--late);font-size:12px;margin-top:3px;font-weight:500}
.rowact{border:1px solid var(--line-2);background:var(--surface-3);border-radius:2px;padding:2px 9px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.todo{color:var(--todo)} .pill.doing{color:var(--doing)} .pill.done{color:var(--done)}
.pill.late{color:var(--late)} .pill.hold{color:var(--hold)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;font-weight:500}

/* 부서별 */
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px}
.dept{border:1px solid var(--line);border-radius:2px;background:var(--surface);display:flex;flex-direction:column}
.dept > header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.dept h3{font-size:13px;font-weight:700;color:var(--navy-2)}
.dept .cnt{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dept ul{list-style:none;margin:0;padding:4px 0;display:flex;flex-direction:column}
.dept li{padding:6px 11px 6px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;position:relative}
.dept li::before{content:"";position:absolute;left:11px;top:13px;width:3px;height:3px;background:var(--accent);border-radius:50%}
.dept li:last-child{border-bottom:0}
.dept li .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.dept li .nm{font-size:13px;font-weight:500;cursor:pointer;text-align:left;background:none;border:0;padding:0;flex:1}
.dept li .nm:hover{text-decoration:underline}
.dept li .meta{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.empty{padding:44px 16px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--navy-2);font-size:14px;font-weight:700;margin-bottom:6px}

.legend{display:flex;flex-wrap:wrap;gap:13px;align-items:center;font-size:12px;color:var(--ink-2);padding:9px 14px;border-top:1px solid var(--line)}
.legend .ph{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:2px;
  padding:2px 6px 2px 3px;background:none;font:inherit;color:inherit;cursor:pointer}
.legend .ph:hover{border-color:var(--line-2);background:var(--surface-3)}
.legend .sw{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.22);flex:0 0 auto}
.legend .tip{color:var(--ink-3);font-size:11.5px}
.swatchbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:2px;padding:4px 8px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.swatchbtn i{width:16px;height:16px;border-radius:2px;border:1px solid rgba(0,0,0,.22);display:block}
.palette{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:2px;
  box-shadow:0 12px 34px -12px rgba(0,0,0,.45);padding:10px;display:flex;flex-direction:column;gap:9px;width:214px}
.palette .ttl{font-size:11.5px;font-weight:700;color:var(--navy-2)}
.palette .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.palette .grid button{width:100%;aspect-ratio:1;border:1px solid rgba(0,0,0,.2);border-radius:2px;cursor:pointer;padding:0}

var el=function(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n};
function pd(s){ if(!s)return null; var p=String(s).split("-"); if(p.length<3)return null;
  var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return isNaN(d.getTime())?null:d; }
function ds(d){ return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
function fmt(s){ return s?String(s).replace(/-/g,"."):"—"; }
function todayUTC(){ var n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function esc(s){ return String(s==null?"":s); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- 저장 ---------- */
function localLoad(){
  try{
    tasks=JSON.parse(localStorage.getItem("um.tasks")||"[]");
    var m=JSON.parse(localStorage.getItem("um.meta")||"null"); if(m)meta=m;
  }catch(e){ tasks=[]; }
  try{ notes=JSON.parse(localStorage.getItem("um.notes")||"[]"); }catch(e){ notes=[]; }
  if(!tasks.length){ tasks=clone(FALLBACK); meta=clone(FALLBACK_META); usingFallback=true; }
}
function localSave(){
  try{ localStorage.setItem("um.tasks",JSON.stringify(tasks)); localStorage.setItem("um.meta",JSON.stringify(meta));
       localStorage.setItem("um.notes",JSON.stringify(notes)); }catch(e){}
}
function note(msg){ var n=$("#syncNote"); if(!msg){n.hidden=true;return;} n.textContent=msg; n.hidden=false; }

function loadScript(src){
  return new Promise(function(res,rej){
    var el=document.createElement("script"); el.src=src; el.async=true;
    el.onload=res; el.onerror=function(){rej(new Error(src))}; document.head.appendChild(el);
  });
}
/* firebase-config.js 로 설정을 넣어 두면 Firestore 를 공유 저장소로 쓴다.
   Firestore compat API 는 collection/doc/onSnapshot 모양이 같아 아래 코드를 그대로 쓴다. */
function tryFirebase(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.projectId||/^여기에/.test(String(cfg.projectId)))return Promise.resolve(null);
  /* jsDelivr 가 막힌 망에서도 되도록 gstatic 을 예비로 둔다.
     Artifact 에서는 저장소 능력이 먼저 잡혀 여기까지 오지 않는다. */
  var HOSTS=["https://cdn.jsdelivr.net/npm/firebase@10.14.1/",
             "https://www.gstatic.com/firebasejs/10.14.1/"];
  function attempt(i){
    if(i>=HOSTS.length)return Promise.resolve(null);
    return loadScript(HOSTS[i]+"firebase-app-compat.js")
      .then(function(){ return loadScript(HOSTS[i]+"firebase-firestore-compat.js"); })
      .then(function(){
        if(!window.firebase||!firebase.firestore)throw new Error("sdk");
        if(!firebase.apps.length)firebase.initializeApp(cfg);
        backend="firebase"; return firebase.firestore();
      })
      .catch(function(){ return attempt(i+1); });
  }
  return attempt(0).then(function(d){
    if(!d)note("Firebase SDK 를 불러오지 못했습니다. 사내망 차단 여부를 확인해 주십시오. 그전까지는 이 브라우저에만 저장됩니다.");
    return d;
  });
}
function storeLabel(){
  if(backend==="firebase")return "Firebase 공유 저장";
  if(!local)return "공유 저장";
  return usingFallback?"기본 일정(내 브라우저)":"내 브라우저 저장";
}
function boot(){
  buildStaticUI(); render();
  var use=(window.claude&&window.claude.use)?window.claude.use("db"):Promise.resolve(null);
  Promise.resolve(use).then(function(d){ return d||tryFirebase(); }).then(function(d){
    if(!d){ local=true; localLoad(); note(offlineMsg()); render(); return; }
    db=d;
    db.collection("tasks").onSnapshot(function(snap){
      tasks=snap.docs.map(function(s){ var o=s.data()||{}; o.id=s.id; return o; });
      note(""); render();
    }, function(e){
      var code=e&&e.code;
      local=true; localLoad();
      if(code==="permission-denied")
        note("Firestore 규칙이 읽기·쓰기를 막고 있습니다. Firebase 콘솔 → Firestore Database → 규칙에서 tasks·meta 컬렉션을 열어 주십시오. 그전까지는 이 브라우저에만 저장됩니다.");
      else if(code==="revoked") note("저장소 접근 권한이 해제되어 읽기 전용으로 표시합니다.");
      else if(backend==="firebase")
        note("Firestore 에 연결하지 못했습니다("+(code||"원인 불명")+"). 설정값과 규칙을 확인해 주십시오. 그전까지는 이 브라우저에만 저장됩니다.");
      else note(offlineMsg());
      render();
    });
    db.collection("notes").onSnapshot(function(snap){
      notes=snap.docs.map(function(s){ var o=s.data()||{}; o.id=s.id; return o; });
      render();
    }, function(e){ if(e&&e.code==="permission-denied")note(noteRuleMsg(e.code)); });
    db.doc("meta/board").onSnapshot(function(s){
      if(s.exists){ var v=s.data()||{}; meta={org:v.org||meta.org,title:v.title||meta.title,target:v.target||"",deptColors:v.deptColors||{}}; render(); }
    }, function(){});
  });
}
function offlineMsg(){
  var how=" 여러 부서가 같이 고치려면 firebase-config.js 에 Firestore 설정을 넣거나, 공유 저장이 되는 링크로 여십시오.";
  return (usingFallback
    ? "공유 저장에 연결하지 못해 기본 일정을 표시하고 있습니다. 여기서 고친 내용은 이 브라우저에만 남습니다."
    : "공유 저장을 쓸 수 없어 이 브라우저에만 저장됩니다. 다른 참석자에게는 보이지 않습니다.")+how;
}
function cleanBody(t){
  var b={}; Object.keys(t).forEach(function(k){
    if(k==="id"||k.charAt(0)==="_")return;
    if(t[k]===undefined)return;
    b[k]=t[k];
  }); return b;
}
function persist(t){
  t.updatedAt=new Date().toISOString();
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  render();
  var body=cleanBody(t);
  return db.collection("tasks").doc(t.id).set(body).catch(function(err){
    note(err&&err.code==="invalid_argument" ? "저장 권한이 없어 반영되지 않았습니다." : "저장에 실패했습니다.");
  });
}
function createTask(data){
  var id="t"+Date.now().toString(36)+Math.floor(Math.random()*900+100);
  data.id=id; data.updatedAt=new Date().toISOString();
  tasks.push(data);
  if(local||!db){ localSave(); render(); return Promise.resolve(id); }
  var body=cleanBody(data);
  render();
  return db.collection("tasks").doc(id).set(body).then(function(){return id})
    .catch(function(){ note("저장에 실패했습니다."); return id; });
}
function noteById(id){ for(var i=0;i<notes.length;i++) if(notes[i].id===id) return notes[i]; return null; }
function noteRuleMsg(code){
  return "메모를 저장하지 못했습니다"+(code?" ("+code+")":"")
    +". Firestore 규칙에 notes 컬렉션이 열려 있는지 확인해 주십시오 — "
    +"match /notes/{doc} { allow read, write: if true; }";
}
function persistNote(n){
  n.updatedAt=new Date().toISOString();
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  render();   /* 저장 결과를 기다리지 않고 화면부터 반영한다 */
  return db.collection("notes").doc(n.id).set(cleanBody(n))
    .catch(function(e){ note(noteRuleMsg(e&&e.code)); });
}
function createNote(data){
  data.id="n"+Date.now().toString(36)+Math.floor(Math.random()*900+100);
  data.updatedAt=new Date().toISOString();
  notes.push(data);
  if(local||!db){ localSave(); render(); return Promise.resolve(data.id); }
  render();
  return db.collection("notes").doc(data.id).set(cleanBody(data)).then(function(){return data.id})
    .catch(function(e){ note(noteRuleMsg(e&&e.code)); return data.id; });
}
function removeNote(id){
  notes=notes.filter(function(n){return n.id!==id});
  if(selNote===id)selNote=null;
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  render();
  return db.collection("notes").doc(id).delete().catch(function(e){ note(noteRuleMsg(e&&e.code)); });
}
function removeTask(id){
  tasks=tasks.filter(function(t){return t.id!==id});
  tasks.forEach(function(t){ if(t.deps&&t.deps.indexOf(id)>=0){ t.deps=t.deps.filter(function(x){return x!==id}); persist(t); } });
  if(selId===id)selId=null;
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  render();
  return db.collection("tasks").doc(id).delete().catch(function(){ note("삭제에 실패했습니다."); });
}
function saveMeta(m){
  meta=m;
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  return db.doc("meta/board").set({org:m.org,title:m.title,target:m.target,deptColors:m.deptColors||{}});
}

/* ---------- 파생 ---------- */
function byId(id){ for(var i=0;i<tasks.length;i++) if(tasks[i].id===id) return tasks[i]; return null; }
function depConflicts(t){
  if(!t||!t.deps||!t.deps.length) return [];
  var s=pd(t.start); if(!s) return [];
  return t.deps.map(byId).filter(function(d){ if(!d)return false; var e=pd(d.end); return e&&s<=e; });
}
function depNames(t){
  if(!t||!t.deps) return "";
  return t.deps.map(function(id){var d=byId(id);return d?d.title:null}).filter(Boolean).join(", ");
}
function effStatus(t){
  if(t.status==="done"||t.status==="hold")return t.status;
  var e=pd(t.end); if(e&&e<todayUTC())return "late";
  return t.status||"todo";
}
var SWATCHES=[
 "#17458C","#1668C1","#0E7C86","#00834B","#7E7A1C","#B26A00","#B0392B","#6B5B95",
 "#4B85D6","#54A6EE","#3FAEB6","#3BB578","#A79F31","#DD9A45","#D2604F","#8E7CB8",
 "#2F3A46","#6B7A8D","#8C5A2B","#7A1F5C","#0B6E4F","#245F9E","#9E2A2B","#4A4E69"];
function isHex(c){ return /^#[0-9a-fA-F]{6}$/.test(String(c||"")); }
/* 사용자가 고른 색 위에서 글자가 읽히도록 흰색·검정을 자동으로 고른다. */
function textOn(hex){
  function lin(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }
  var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  return (0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b))>0.36 ? "#16202b" : "#ffffff";
}
function closePalette(){
  var o=document.querySelector(".palette"); if(o)o.remove();
  document.removeEventListener("pointerdown",paletteOutside,true);
  document.removeEventListener("keydown",paletteEsc,true);
}
function paletteOutside(e){ if(!e.target.closest||!e.target.closest(".palette"))closePalette(); }
function paletteEsc(e){ if(e.key==="Escape"){ e.stopPropagation(); closePalette(); } }
/* anchor 아래에 색 고르개를 띄운다. onPick(hex) / onReset() */

function memoIcon(size){
  var ns="http://www.w3.org/2000/svg", g=document.createElementNS(ns,"svg");
  g.setAttribute("viewBox","0 0 24 24"); g.setAttribute("width",size); g.setAttribute("height",size);
  g.setAttribute("fill","none"); g.setAttribute("stroke","currentColor");
  g.setAttribute("stroke-width","1.7"); g.setAttribute("stroke-linecap","round");
  g.setAttribute("stroke-linejoin","round");
  [["path",{d:"M8 2.5v3M12 2.5v3M16 2.5v3"}],
   ["rect",{x:"4",y:"4.5",width:"16",height:"17",rx:"2"}],
   ["path",{d:"M8 11h8M8 15h5"}]].forEach(function(it){
    var e=document.createElementNS(ns,it[0]);
    Object.keys(it[1]).forEach(function(k){ e.setAttribute(k,it[1][k]); });
    g.appendChild(e);
  });
  return g;
}
var NOTE_SWATCHES=["#FFF3BF","#FFE1C2","#FFD9DE","#EADFF7","#D8ECFF","#CFF0EA","#DDF3D5","#E8E4DC"];
function openPalette(anchor,title,current,onPick,onReset,swatches){
  closePalette();
  var box=el("div","palette");
  box.appendChild(el("div","ttl",title));
  var grid=el("div","grid");
  (swatches||SWATCHES).forEach(function(c){
    var b=el("button"); b.type="button"; b.style.background=c; b.title=c;
    b.setAttribute("aria-label",c);
    b.setAttribute("aria-pressed",String(String(current).toLowerCase()===c.toLowerCase()));
    b.addEventListener("click",function(){ onPick(c); closePalette(); });
    grid.appendChild(b);
  });
  box.appendChild(grid);
  var row=el("div","row");
  var ci=document.createElement("input"); ci.type="color"; ci.value=isHex(current)?current:"#17458C";
  ci.addEventListener("change",function(){ onPick(ci.value); });
  row.appendChild(ci); row.appendChild(el("span",null,"직접 고르기"));
  if(onReset){
    var r=el("button","rst","기본값"); r.type="button";
    r.addEventListener("click",function(){ onReset(); closePalette(); });
    row.appendChild(r);
  }
  box.appendChild(row);
  document.body.appendChild(box);
  var rc=anchor.getBoundingClientRect();
  var top=rc.bottom+window.scrollY+6, left=rc.left+window.scrollX;
  left=Math.min(left,window.scrollX+document.documentElement.clientWidth-box.offsetWidth-12);
  if(rc.bottom+box.offsetHeight+10>window.innerHeight)top=rc.top+window.scrollY-box.offsetHeight-6;
  box.style.top=Math.max(8,top)+"px"; box.style.left=Math.max(8,left)+"px";
  setTimeout(function(){
    document.addEventListener("pointerdown",paletteOutside,true);
    document.addEventListener("keydown",paletteEsc,true);
  },0);
}
var DEPT_PALETTE=["#17458C","#1668C1","#0E7C86","#00834B","#7E7A1C","#B26A00",
                  "#B0392B","#6B5B95","#245F9E","#0B6E4F","#8C5A2B","#4A4E69"];
var NO_DEPT="부서 미정";
function deptKey(t){ return (t&&t.dept)?t.dept:NO_DEPT; }
/* 부서 색은 이름순 자리로 정한다. 해시는 서로 비슷한 색이 겹치기 쉬워
   기획처와 총무과가 같은 초록으로 나오는 일이 생긴다. */
function allTaskDepts(){
  var seen={}; tasks.forEach(function(t){ seen[deptKey(t)]=1 });
  return Object.keys(seen).filter(function(d){return d!==NO_DEPT}).sort(function(a,b){return a.localeCompare(b,"ko")});
}
function deptColor(name){
  var m=meta.deptColors&&meta.deptColors[name];
  if(isHex(m))return m;
  if(name===NO_DEPT)return "#8290A3";
  var i=allTaskDepts().indexOf(name);
  if(i<0)return "#8290A3";
  return DEPT_PALETTE[i%DEPT_PALETTE.length];
}
function nodeColor(t){ return isHex(t.color)?t.color:deptColor(deptKey(t)); }
/* 캔버스에 세로로 쌓을 부서 순서 — 착수가 이른 부서부터. */
function deptOrder(list){
  var first={};
  list.forEach(function(t){
    var k=deptKey(t), st=t.start||"9999";
    if(first[k]===undefined||st<first[k])first[k]=st;
  });
  return Object.keys(first).sort(function(a,b){
    if(a===NO_DEPT)return 1; if(b===NO_DEPT)return -1;
    return String(first[a]).localeCompare(String(first[b]))||a.localeCompare(b,"ko");
  });
}
function allDepts(){ var s={}; BASE_DEPTS.forEach(function(d){s[d]=1}); tasks.forEach(function(t){if(t.dept)s[t.dept]=1}); return Object.keys(s); }
function activeDepts(){
  var s={}; tasks.forEach(function(t){ if(t.dept)s[t.dept]=(s[t.dept]||0)+1 });
  return Object.keys(s).sort(function(a,b){return s[b]-s[a]||a.localeCompare(b,"ko")}).map(function(d){return{name:d,count:s[d]}});
}
function visible(){
  var q=query.trim().toLowerCase();
  return tasks.filter(function(t){
    if(filterDepts.length&&filterDepts.indexOf(t.dept)<0)return false;
    if(filterStatus&&effStatus(t)!==filterStatus)return false;
    if(q&&[t.title,t.dept,t.owner,t.coop,t.deliverable,t.note].join(" ").toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){
    return String(a.start||"").localeCompare(String(b.start||"")) ||
           deptKey(a).localeCompare(deptKey(b),"ko");
  });
}

/* 세로 위치가 없는 과제에 단계별로 겹치지 않는 자리를 계산해 준다. */
function layout(list,ppd){
  var LABEL_PX=178;
  var bands={}, y=PAD_TOP;
  deptOrder(list).forEach(function(dk){
    var rows=list.filter(function(t){return deptKey(t)===dk})
      .sort(function(a,b){return String(a.start||"").localeCompare(String(b.start||""))});
    if(!rows.length)return;
    var lanes=[];
    rows.forEach(function(t){
      var s=pd(t.start), e=pd(t.end)||s; if(!s){ t._y=y; return; }
      /* 막대가 좁으면 제목이 오른쪽 바깥에 붙으므로 그 폭만큼 자리를 더 잡는다. */
      var days=Math.round((e-s)/DAY)+1, occ=e.getTime();
      if(ppd && days*ppd < 118) occ += Math.round(LABEL_PX/ppd)*DAY;
      var i=0; for(;i<lanes.length;i++){ if(lanes[i] < s.getTime()) break; }
      if(i===lanes.length)lanes.push(0);
      lanes[i]=occ;
      t._y=y+i*(NODE_H+ROW_GAP);
    });
    bands[dk]={top:y,bottom:y+lanes.length*(NODE_H+ROW_GAP),rows:lanes.length};
    y+=lanes.length*(NODE_H+ROW_GAP)+BAND_GAP;
  });
  return bands;
}

/* ---------- 기본 UI ---------- */
function buildStaticUI(){
  var zb=$("#zoomBox");
  ZOOMS.forEach(function(z,i){
    var b=el("button",null,z.k); b.type="button"; b.setAttribute("aria-pressed",String(i===zoom));
    b.addEventListener("click",function(){ zoom=i; render(); }); zb.appendChild(b);
  });
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      view=b.dataset.view;
      document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",String(o===b))});
      render();
    });
  });
  $("#q").addEventListener("input",function(e){ query=e.target.value; render(); });
  $("#fStatus").addEventListener("change",function(e){ filterStatus=e.target.value; render(); });
  $("#addBtn").addEventListener("click",quickAdd);
  $("#noteBtn").addEventListener("click",addNote);
  $("#csvBtn").addEventListener("click",exportCsv);
  $("#tidyBtn").addEventListener("click",tidy);
  $("#setTarget").addEventListener("click",function(){
    $("#f_org").value=meta.org||""; $("#f_boardTitle").value=meta.title||"";
    $("#f_target").value=meta.target||""; $("#targetDlg").showModal();
  });
  $("#tgCancel").addEventListener("click",function(){ $("#targetDlg").close(); });
  $("#targetForm").addEventListener("submit",function(){
    saveMeta({org:$("#f_org").value.trim()||"부산대학교",
              title:$("#f_boardTitle").value.trim()||"통합 추진 일정판",
              target:$("#f_target").value, deptColors:meta.deptColors||{}});
  });
  document.addEventListener("keydown",function(e){
    var tag=e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
    if(e.key==="Escape"){ selId=null; selNote=null; render(); }
    if((e.key==="Delete"||e.key==="Backspace")&&selNote){
      e.preventDefault();
      var nt0=noteById(selNote);
      if(nt0&&(!nt0.text||confirm("이 메모를 지웁니다.")))removeNote(selNote);
      return;
    }
    if((e.key==="Delete"||e.key==="Backspace")&&selId){
      e.preventDefault();
      var t=byId(selId);
      if(t&&confirm("‘"+t.title+"’을(를) 삭제합니다. 되돌릴 수 없습니다."))removeTask(selId);
    }
  });
}
function tidy(){
  tasks.forEach(function(t){ delete t.y; });
  layout(visible(),ZOOMS[zoom].ppd);
  tasks.forEach(function(t){ if(t._y!=null){ t.y=t._y; persist(t); } });
  render();
}
/* 지금 보고 있는 화면 한가운데에 메모를 붙인다. */
function addNote(){
  var d=todayUTC(), y=120;
  if(CANVAS&&CANVAS.scroller){
    var sc=CANVAS.scroller;
    d=CANVAS.dateAt(sc.scrollLeft+sc.clientWidth/2-98);
    y=Math.max(8,sc.scrollTop+Math.min(90,sc.clientHeight/2-60));
  }
  view="canvas";
  document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",String(o.dataset.view==="canvas"))});
  createNote({text:"",date:ds(d),y:Math.round(y/8)*8,color:""}).then(function(id){
    selNote=id; selId=null; render();
    var ta=document.querySelector(".insp #n_text"); if(ta)ta.focus();
  });

/* ---------- 일정 캔버스 ---------- */
function renderCanvas(list){
  var ppd=ZOOMS[zoom].ppd;
  var min=null,max=null;
  list.forEach(function(t){ var s=pd(t.start),e=pd(t.end)||pd(t.start);
    if(!s)return; if(!min||s<min)min=s; if(!max||!e||e>max)max=e||s; });
  var now=todayUTC();
  if(!min){ min=new Date(now.getTime()-30*DAY); max=new Date(now.getTime()+150*DAY); }
  if(min>now)min=now; if(max<now)max=now;
  var R0=new Date(Date.UTC(min.getUTCFullYear(),min.getUTCMonth(),1));
  R0=new Date(R0.getTime()-31*DAY); R0=new Date(Date.UTC(R0.getUTCFullYear(),R0.getUTCMonth(),1));
  var R1=new Date(Date.UTC(max.getUTCFullYear(),max.getUTCMonth()+3,0));
  var totalDays=Math.round((R1-R0)/DAY)+1;
  var W=Math.round(totalDays*ppd);
  var x=function(d){ return Math.round((d-R0)/DAY*ppd); };
  var dateAt=function(px){ return new Date(R0.getTime()+Math.round(px/ppd)*DAY); };
  var snap=function(d){ var k=Math.round((d-R0)/DAY/7)*7; return new Date(R0.getTime()+k*DAY); };

  var bands=layout(list,ppd);
  var H=PAD_TOP;
  list.forEach(function(t){ var y=(t.y!=null?t.y:t._y)||0; if(y+NODE_H>H)H=y+NODE_H; });
  notes.forEach(function(nt){ var y=(nt.y!=null?nt.y:100)+(nt.min?42:120); if(y>H)H=y; });
  H+=140;

  var board=el("div","board");
  var scroller=el("div","scroller");

  /* 눈금자 */
  var ruler=el("div","ruler"); ruler.style.width=W+"px";
  var cur=new Date(R0);
  while(cur<=R1){
    var lastD=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,0)).getUTCDate();
    var mo=el("div","mo"); mo.style.width=Math.round(lastD*ppd)+"px";
    if(cur.getUTCMonth()===0||cur.getTime()===R0.getTime())mo.appendChild(el("span","y",cur.getUTCFullYear()+"년"));
    mo.appendChild(document.createTextNode((cur.getUTCMonth()+1)+"월"));
    ruler.appendChild(mo);
    cur=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1));
  }
  scroller.appendChild(ruler);

  var surf=el("div","surface");
  surf.style.width=W+"px"; surf.style.height=H+"px";

  var grid=el("div","vgrid");
  cur=new Date(R0);
  while(cur<=R1){
    var g=el("i"); if(cur.getUTCMonth()%3===0)g.className="q";
    g.style.left=x(cur)+"px"; grid.appendChild(g);
    cur=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1));
  }
  surf.appendChild(grid);

  if(now>=R0&&now<=R1){
    var nl=el("div","nowline"); nl.style.left=x(now)+"px"; nl.appendChild(el("b",null,"오늘")); surf.appendChild(nl);
  }

  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","edges"); svg.setAttribute("width",W); svg.setAttribute("height",H);
  var defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML='<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">'
    +'<path d="M0,0 L8,4 L0,8 z" fill="var(--edge)"/></marker>'
    +'<marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">'
    +'<path d="M0,0 L8,4 L0,8 z" fill="var(--late)"/></marker>';
  svg.appendChild(defs);
  surf.appendChild(svg);

  if(!list.length){
    var hint=el("div","drophint");
    hint.appendChild(el("b",null,"빈 곳을 좌우로 끌어 보세요"));
    hint.appendChild(document.createTextNode("끈 만큼이 그 과제의 기간이 됩니다"));
    var sb=seedButton();
    if(sb){ sb.style.pointerEvents="auto"; hint.appendChild(document.createElement("br")); hint.appendChild(sb); }
    surf.appendChild(hint);
  }

  /* 부서 구역 */
  Object.keys(bands).forEach(function(dk,i){
    var bd=bands[dk], band=el("div","band"+(i%2?" alt":""));
    band.style.top=(bd.top-9)+"px";
    band.style.height=(bd.bottom-bd.top+6)+"px";
    band.style.width=W+"px";
    var lb=el("span","bl",dk); lb.style.borderLeftColor=deptColor(dk);
    band.appendChild(lb);
    surf.insertBefore(band,svg);
  });

  /* 노드 */
  var nodeOf={};
  list.forEach(function(t){
    var s=pd(t.start), e=pd(t.end)||s; if(!s)return;
    var y=(t.y!=null?t.y:t._y)||PAD_TOP;
    var left=x(s), w=Math.max(14,x(new Date(e.getTime()+DAY))-left);
    var cf=depConflicts(t);
    var n=el("div","node st-"+effStatus(t)+(cf.length?" bad":"")+(selId===t.id?" sel":"")+(w<118?" slim":""));
    n.dataset.id=t.id; n.style.left=left+"px"; n.style.top=y+"px"; n.style.width=w+"px";
    var bg=nodeColor(t);
    n.style.background=bg;
    if(isHex(bg))n.style.color=textOn(bg);
    n.tabIndex=0;
    n.title=(t.dept||"부서 미정")+" · "+fmt(t.start)+" ~ "+fmt(t.end)+" · "+STATUS[effStatus(t)]
      +(depNames(t)?"\n선행: "+depNames(t):"")+(cf.length?"\n⚠ 선행 ‘"+cf[0].title+"’ 종료 전 시작":"");
    if(w>=118){
      n.appendChild(el("div","t",t.title||"(제목 없음)"));
      n.appendChild(el("div","m",(t.dept||"부서 미정")+(t.owner?" · "+t.owner:"")));
    }
    n.appendChild(el("div","hL")); n.appendChild(el("div","hR"));
    var lk=el("div","link"); lk.title="여기서 끌어 다른 과제에 놓으면 선행관계가 걸립니다"; n.appendChild(lk);
    surf.appendChild(n);
    nodeOf[t.id]={x:left,w:w,y:y};
    if(w<118){
      var out=el("div","tagout"); out.style.left=(left+w+8)+"px"; out.style.top=y+"px";
      out.appendChild(el("b",null,t.title||"(제목 없음)"));
      out.appendChild(el("span",null,(t.dept||"부서 미정")+(t.owner?" · "+t.owner:"")));
      surf.appendChild(out);
    }
  });

  /* 선행관계 선 */
  list.forEach(function(t){
    if(!t.deps)return;
    var to=nodeOf[t.id]; if(!to)return;
    t.deps.forEach(function(pid){
      var fr=nodeOf[pid]; if(!fr)return;
      var src=byId(pid), bad=false;
      if(src){ var se=pd(src.end), ts=pd(t.start); bad=!!(se&&ts&&ts<=se); }
      var x1=fr.x+fr.w, y1=fr.y+NODE_H/2, x2=to.x, y2=to.y+NODE_H/2;
      var dx=Math.max(26,Math.abs(x2-x1)/2);
      var p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("class","e"+(bad?" bad":""));
      p.setAttribute("d","M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2);
      p.setAttribute("marker-end",bad?"url(#ahb)":"url(#ah)");
      var tt=document.createElementNS("http://www.w3.org/2000/svg","title");
      tt.textContent=(src?src.title:"?")+" → "+t.title+(bad?"  ⚠ 선행 종료 전 시작":"")+"  (클릭하면 끊김)";
      p.appendChild(tt);
      p.addEventListener("click",function(ev){
        ev.stopPropagation();
        t.deps=t.deps.filter(function(v){return v!==pid}); persist(t);
      });
      svg.appendChild(p);
    });
  });

  /* 이슈 메모 — 캔버스에는 표시만 하고, 편집은 오른쪽 패널에서 한다 */
  notes.forEach(function(nt){
    var d=pd(nt.date)||todayUTC();
    var st=el("div","sticky"+(nt.min?" min":"")+(selNote===nt.id?" sel":""));
    st.dataset.id=nt.id;
    st.style.left=x(d)+"px"; st.style.top=((nt.y!=null?nt.y:100))+"px";
    st.style.background=isHex(nt.color)?nt.color:"var(--note-bg)";
    st.style.color=isHex(nt.color)?textOn(nt.color):"var(--note-ink)";
    st.appendChild(el("span","pin"));
    if(nt.min){
      var ic=el("span","ico"); ic.appendChild(memoIcon(17)); st.appendChild(ic);
      st.title=(nt.text||"(빈 메모)")+"\n\n누르면 오른쪽에서 편집 · 끌어서 옮기기";
    }else{
      st.appendChild(el("div","bd"+(nt.text?"":" ph"),nt.text||"(빈 메모)"));
      st.title="누르면 오른쪽에서 편집 · 끌어서 옮기기";
    }
    surf.appendChild(st);
    bindSticky(st,nt,{x:x,dateAt:dateAt,snap:snap},function(){
      selNote=nt.id; selId=null; render();
    });
  });

  CANVAS=  CANVAS={x:x,dateAt:dateAt,scroller:scroller};
  bindCanvas(surf,svg,{x:x,dateAt:dateAt,snap:snap,ppd:ppd,R0:R0,W:W});
  scroller.appendChild(surf);
  board.appendChild(scroller);
  board.appendChild(renderInspector());

  if(!scrolledOnce){
    scrolledOnce=true;
    requestAnimationFrame(function(){ scroller.scrollLeft=Math.max(0,x(now)-260); });
  }
  return board;
}

/* 스티커는 머리띠를 잡아 옮긴다. 놓는 순간의 가로 위치가 그 메모의 시점이 된다. */
function bindSticky(st,nt,S,onTap){
  var hd=st, drag=null;
  hd.addEventListener("pointerdown",function(ev){
    if(ev.button!==0)return;
    selNote=nt.id; st.classList.add("sel");
    var surf=st.parentNode, r=surf.getBoundingClientRect();
    drag={sx:ev.clientX-r.left,sy:ev.clientY-r.top,ox:parseFloat(st.style.left),oy:parseFloat(st.style.top),moved:false};
    hd.setPointerCapture(ev.pointerId); ev.preventDefault(); ev.stopPropagation();
  });
  hd.addEventListener("pointermove",function(ev){
    if(!drag)return;
    var surf=st.parentNode, r=surf.getBoundingClientRect();
    var dx=ev.clientX-r.left-drag.sx, dy=ev.clientY-r.top-drag.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)drag.moved=true;
    st.style.left=(drag.ox+dx)+"px";
    st.style.top=Math.max(0,Math.round((drag.oy+dy)/8)*8)+"px";
  });
  function up(ev){
    if(!drag)return;
    var moved=drag.moved; drag=null;
    try{ hd.releasePointerCapture(ev.pointerId); }catch(e){}
    if(!moved&&onTap){ onTap(); return; }
    nt.date=ds(S.snap(S.dateAt(parseFloat(st.style.left))));
    nt.y=parseFloat(st.style.top);
    persistNote(nt);
  }
  hd.addEventListener("pointerup",up);
  hd.addEventListener("pointercancel",up);
}

/* ---------- 캔버스 조작 ---------- */
function bindCanvas(surf,svg,S){
  var drag=null;

  function localPt(ev){
    var r=surf.getBoundingClientRect();
    return {x:ev.clientX-r.left, y:ev.clientY-r.top};
  }
  function snapY(v){ return Math.max(0,Math.round(v/8)*8); }
  /* 먼 과제로 선을 끌 때 캔버스 가장자리에서 자동으로 스크롤한다. */
  function autoScroll(ev){
    var sc=surf.parentNode, r=sc.getBoundingClientRect(), M=56;
    if(ev.clientX>r.right-M)sc.scrollLeft+=14;
    else if(ev.clientX<r.left+M)sc.scrollLeft-=14;
    if(ev.clientY>r.bottom-M)sc.scrollTop+=10;
    else if(ev.clientY<r.top+M+30)sc.scrollTop-=10;
  }

  surf.addEventListener("pointerdown",function(ev){
    if(ev.button!==0)return;
    /* 캔버스 밖에서 손을 뗀 이전 드래그의 잔여물을 치운다. */
    surf.querySelectorAll(".newspan").forEach(function(g){g.remove()});
    svg.querySelectorAll("path.tmp").forEach(function(g){g.remove()});
    if(ev.target.closest&&ev.target.closest(".sticky"))return;
    var node=ev.target.closest?ev.target.closest(".node"):null;
    var pt=localPt(ev);

    if(ev.target.classList&&ev.target.classList.contains("link")&&node){
      drag={mode:"link",from:node.dataset.id,path:null};
      var p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("class","tmp"); svg.appendChild(p); drag.path=p;
      drag.ox=parseFloat(node.style.left)+parseFloat(node.style.width);
      drag.oy=parseFloat(node.style.top)+NODE_H/2;
      surf.setPointerCapture(ev.pointerId); ev.preventDefault(); return;
    }
    if(node){
      var t=byId(node.dataset.id); if(!t)return;
      selId=t.id; selNote=null;
      var cls=ev.target.classList;
      var mode = cls&&cls.contains("hL") ? "resizeL" : (cls&&cls.contains("hR") ? "resizeR" : "move");
      drag={mode:mode,id:t.id,node:node,startX:pt.x,startY:pt.y,
            ox:parseFloat(node.style.left),oy:parseFloat(node.style.top),ow:parseFloat(node.style.width)};
      node.classList.add("sel");
      surf.setPointerCapture(ev.pointerId); ev.preventDefault();
      renderInspectorInto();
      return;
    }
    /* 빈 곳에서 끌기 → 새 과제 */
    selId=null; selNote=null; renderInspectorInto();
    drag={mode:"create",startX:pt.x,startY:pt.y,ghost:null};
    surf.setPointerCapture(ev.pointerId);
  });

  surf.addEventListener("pointermove",function(ev){
    if(!drag)return;
    var pt=localPt(ev);
    if(drag.mode==="create"){
      var a=Math.min(drag.startX,pt.x), b=Math.max(drag.startX,pt.x);
      if(b-a<6&&!drag.ghost)return;
      if(!drag.ghost){ drag.ghost=el("div","newspan"); surf.appendChild(drag.ghost); }
      var d1=S.snap(S.dateAt(a)), d2=S.snap(S.dateAt(b));
      if(d2<=d1)d2=new Date(d1.getTime()+7*DAY);
      drag.d1=d1; drag.d2=new Date(d2.getTime()-DAY);
      drag.ghost.style.left=S.x(d1)+"px"; drag.ghost.style.width=(S.x(d2)-S.x(d1))+"px";
      drag.ghost.style.top=snapY(drag.startY-NODE_H/2)+"px";
      drag.ghost.textContent=fmt(dsx(d1))+" ~ "+fmt(dsx(drag.d2));
      return;
    }
    if(drag.mode==="link"){
      autoScroll(ev);
      var x1=drag.ox,y1=drag.oy,x2=pt.x,y2=pt.y,dx=Math.max(26,Math.abs(x2-x1)/2);
      drag.path.setAttribute("d","M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2);
      return;
    }
    var n=drag.node;
    if(drag.mode==="move"){
      n.style.left=(drag.ox+(pt.x-drag.startX))+"px";
      n.style.top=snapY(drag.oy+(pt.y-drag.startY))+"px";
    }else if(drag.mode==="resizeR"){
      n.style.width=Math.max(14,drag.ow+(pt.x-drag.startX))+"px";
    }else{
      var dxm=pt.x-drag.startX, nw=Math.max(14,drag.ow-dxm);
      n.style.left=(drag.ox+(drag.ow-nw))+"px"; n.style.width=nw+"px";
    }
  });

  function finish(ev){
    if(!drag)return;
    var d=drag; drag=null;
    try{ surf.releasePointerCapture(ev.pointerId); }catch(e){}

    if(d.mode==="create"){
      if(d.ghost){
        var top=parseFloat(d.ghost.style.top);
        d.ghost.remove();
        createTask({title:"새 과제",dept:deptAtY(top),owner:"",
          start:dsx(d.d1),end:dsx(d.d2),status:"todo",coop:"",deliverable:"",note:"",deps:[],y:top})
          .then(function(id){
            selId=id; render();
            var i=document.querySelector(".insp #i_title"); if(i){ i.focus(); i.select(); }
          });
      }else{ render(); }
      return;
    }
    if(d.mode==="link"){
      d.path.remove();
      var tgt=document.elementFromPoint(ev.clientX,ev.clientY);
      var tn=tgt&&tgt.closest?tgt.closest(".node"):null;
      if(tn&&tn.dataset.id&&tn.dataset.id!==d.from){
        var t=byId(tn.dataset.id);
        if(t){
          t.deps=t.deps||[];
          if(t.deps.indexOf(d.from)<0 && !makesCycle(t.id,d.from)){ t.deps.push(d.from); persist(t); }
          else if(makesCycle(t.id,d.from)) note("서로 선행이 되는 순환 관계는 만들 수 없습니다.");
          else render();
        }
      }else render();
      return;
    }
    var t2=byId(d.id); if(!t2){ render(); return; }
    var n=d.node;
    var nl=parseFloat(n.style.left), nw=parseFloat(n.style.width), nt=parseFloat(n.style.top);
    var s=S.snap(S.dateAt(nl)), e=S.snap(S.dateAt(nl+nw));
    if(e<=s)e=new Date(s.getTime()+7*DAY);
    t2.start=dsx(s); t2.end=dsx(new Date(e.getTime()-DAY));
    if(d.mode==="move")t2.y=nt;
    persist(t2);
  }
  surf.addEventListener("pointerup",finish);
  surf.addEventListener("pointercancel",finish);
  surf.addEventListener("dblclick",function(ev){
    var n=ev.target.closest?ev.target.closest(".node"):null;
    if(n){ selId=n.dataset.id; render(); var i=document.querySelector(".insp #i_title"); if(i)i.focus(); }
  });
}
function dsx(d){ return ds(d); }
/* 드래그를 시작한 세로 위치가 어느 부서 구역인지 찾아 그 부서로 만든다. */
function deptAtY(y){
  var bands=layout(visible(),ZOOMS[zoom].ppd), hit="", inside=false, best=Infinity;
  Object.keys(bands).forEach(function(k){
    var b=bands[k];
    if(!inside&&y>=b.top-BAND_GAP&&y<=b.bottom+BAND_GAP/2){ hit=k; inside=true; return; }
    if(inside)return;
    var d=Math.min(Math.abs(y-b.top),Math.abs(y-b.bottom));
    if(d<best){ best=d; hit=k; }
  });
  return (hit&&hit!==NO_DEPT)?hit:"";
}
function makesCycle(targetId,newDepId){
  var seen={}, stack=[newDepId];
  while(stack.length){
    var cur=stack.pop();
    if(cur===targetId)return true;
    if(seen[cur])continue; seen[cur]=1;
    var t=byId(cur); if(t&&t.deps)t.deps.forEach(function(d){stack.push(d)});
  }
  return false;
}

function exportCsv(){
  var rows=[["과제명","주관부서","협조부서","담당자","시작일","종료일","상태","선행과제","선후관계 충돌","산출물","비고"]];
  visible().forEach(function(t){
    rows.push([t.title||"",t.dept||"",t.coop||"",t.owner||"",t.start||"",t.end||"",
      STATUS[effStatus(t)],depNames(t),depConflicts(t).length?"충돌":"",t.deliverable||"",t.note||""]);
  });
  var csv="﻿"+rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"' }).join(",") }).join("\r\n");
  var name="통합추진일정_"+new Date().toISOString().slice(0,10)+".csv";
  var use=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
  Promise.resolve(use).then(function(d){
    if(!d){ note("이 화면에서는 파일 내려받기를 쓸 수 없습니다. 표 보기에서 복사해 주세요."); return; }
    return d.save({filename:name,data:csv});
  }).catch(function(){ note("내려받기가 취소되었거나 실패했습니다."); });
}

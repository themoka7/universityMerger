<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="대학 통합 추진 과제를 단계·부서·기간별로 정리한 일정판">
<title>통합 추진 일정판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root{
  --paper:#f1f4f4; --surface:#ffffff; --surface-2:#e8eded; --surface-3:#f7f9f9; --canvas:#eef2f2;
  --ink:#132029; --ink-2:#4a5c63; --ink-3:#7e9096;
  --line:#d7dede; --line-2:#bcc8c9;
  --accent:#0f5f5c; --accent-ink:#0b4442; --accent-soft:#dcebe8; --on-accent:#ffffff;
  --todo:#6b7c82; --doing:#9a6410; --done:#2c6b4f; --late:#a4302a; --hold:#7b6a86;
  --p1:#0f5f5c; --p2:#2b7a6a; --p3:#5c8f58; --p4:#93903f; --p5:#b07a38; --p6:#a3603c; --p7:#a04b3f;
  --edge:#6b8386;
  --shadow:0 1px 2px rgba(19,32,41,.05), 0 10px 26px -16px rgba(19,32,41,.35);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1517; --surface:#151f22; --surface-2:#1d292c; --surface-3:#111a1d; --canvas:#0a1113;
    --ink:#e7eeee; --ink-2:#a9bcbf; --ink-3:#7b9195;
    --line:#28373a; --line-2:#3a4d51;
    --accent:#5cbdad; --accent-ink:#8fd7c9; --accent-soft:#1a3532; --on-accent:#08171a;
    --todo:#8ea0a6; --doing:#e0a54a; --done:#6cc295; --late:#e88b80; --hold:#b39ec4;
    --p1:#2e8f88; --p2:#41a58f; --p3:#7cb46f; --p4:#c0b855; --p5:#d69a4e; --p6:#d4835f; --p7:#cf6f5d;
    --edge:#5c7275;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0d1517; --surface:#151f22; --surface-2:#1d292c; --surface-3:#111a1d; --canvas:#0a1113;
  --ink:#e7eeee; --ink-2:#a9bcbf; --ink-3:#7b9195;
  --line:#28373a; --line-2:#3a4d51;
  --accent:#5cbdad; --accent-ink:#8fd7c9; --accent-soft:#1a3532; --on-accent:#08171a;
  --todo:#8ea0a6; --doing:#e0a54a; --done:#6cc295; --late:#e88b80; --hold:#b39ec4;
  --p1:#2e8f88; --p2:#41a58f; --p3:#7cb46f; --p4:#c0b855; --p5:#d69a4e; --p6:#d4835f; --p7:#cf6f5d;
  --edge:#5c7275;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1480px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.masthead{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.masthead h1{font-family:var(--serif);font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.01em;line-height:1.15}
.masthead .sub{margin:7px 0 0;color:var(--ink-2);max-width:60ch;font-size:13.5px}
.dday{text-align:right;flex:0 0 auto}
.dday .label{font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.dday .count{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.1;color:var(--accent)}
.dday .date{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.dday button{background:none;border:0;padding:0;margin-top:2px;font-size:11px;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.stat{background:var(--surface);padding:11px 14px;display:flex;flex-direction:column;gap:1px}
.stat .n{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .t{font-size:12px;color:var(--ink-2)}
.stat.is-warnk .n,.stat.is-late .n{color:var(--late)}
.stat.is-doing .n{color:var(--doing)} .stat.is-done .n{color:var(--done)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:none;padding:7px 15px;cursor:pointer;color:var(--ink-2);font-weight:500;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type="text"],input[type="date"],input[type="search"],textarea{
  font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:3px;padding:6px 9px}
input[type="search"]{min-width:150px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:7px 14px;border-radius:3px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2);font-weight:500}
.btn:hover{filter:brightness(1.07)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);padding:9px 13px;font-size:13px;border-radius:0 3px 3px 0}
.note[hidden]{display:none!important}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--serif);font-size:17px;font-weight:700}
.panel-head .hint{font-size:12px;color:var(--ink-3)}
.zoom{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:4px 10px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line);font-size:12px}
.zoom button:last-child{border-right:0}
.zoom button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* ---------- 캔버스 ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.scroller{position:relative;overflow:auto;max-height:min(70vh,660px);background:var(--canvas);
  border-right:1px solid var(--line);overscroll-behavior:contain}
.ruler{position:sticky;top:0;z-index:6;height:34px;display:flex;background:var(--surface);
  border-bottom:1px solid var(--line-2);width:max-content;min-width:100%}
.ruler .mo{flex:0 0 auto;border-left:1px solid var(--line);padding:3px 0 0 5px;font-family:var(--mono);
  font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;line-height:1.25}
.ruler .mo:first-child{border-left:0}
.ruler .mo .y{display:block;font-size:9.5px;color:var(--ink-3);letter-spacing:.06em}
.surface{position:relative;touch-action:none;cursor:crosshair}
.vgrid{position:absolute;inset:0;pointer-events:none}
.vgrid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.vgrid i.q{background:var(--line-2)}
.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--late);pointer-events:none;z-index:4}
.nowline b{position:absolute;top:2px;left:5px;white-space:nowrap;font:500 10px var(--mono);color:var(--late);background:var(--surface);padding:0 4px;border-radius:2px}
.edges{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3}
.edges path.e{fill:none;stroke:var(--edge);stroke-width:1.9;pointer-events:stroke;cursor:pointer}
.edges path.e:hover{stroke:var(--ink);stroke-width:2.6}
.edges path.e.bad{stroke:var(--late);stroke-dasharray:5 3;stroke-width:2}
.edges path.tmp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}

.node{position:absolute;height:46px;border-radius:5px;border:1px solid rgba(0,0,0,.16);
  display:flex;flex-direction:column;justify-content:center;padding:0 9px;gap:1px;
  color:var(--on-accent);cursor:grab;touch-action:none;z-index:5;
  box-shadow:0 1px 2px rgba(0,0,0,.18);background-clip:padding-box}
.node:active{cursor:grabbing}
.node .t{font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.node .m{font-size:10.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.node.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:7}
.node.st-done{opacity:.58}
.node.st-todo{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px)}
.node.st-hold{filter:grayscale(.65)}
.node.bad{border-color:var(--late);box-shadow:0 0 0 2px var(--late)}
.node.slim{padding:0}
.node .hL,.node .hR{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none}
.node .hL{left:0} .node .hR{right:0}
.node .link{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  border-radius:50%;background:var(--surface);border:2px solid var(--edge);cursor:crosshair;z-index:8;
  touch-action:none;opacity:.55}
.node:hover .link,.node.sel .link,.node:focus-within .link{opacity:1}
.node .link:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-50%) scale(1.15)}
.node.sel .link{border-color:var(--ink)}
.tagout{position:absolute;height:46px;display:flex;flex-direction:column;justify-content:center;
  font-size:11px;line-height:1.25;color:var(--ink-2);white-space:nowrap;pointer-events:none;z-index:5}
.tagout b{font-weight:600;color:var(--ink)}
.tagout span{font-size:10px;color:var(--ink-3)}
.newspan{position:absolute;height:46px;border:2px dashed var(--accent);background:var(--accent-soft);
  opacity:.75;border-radius:5px;pointer-events:none;z-index:9;display:flex;align-items:center;
  padding:0 8px;font:500 11px var(--mono);color:var(--accent-ink);overflow:hidden}
.drophint{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:2;pointer-events:none;
  color:var(--ink-3);font-size:13px;text-align:center;line-height:1.7}
.drophint b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink-2);margin-bottom:2px}

/* 인스펙터 */
.insp{padding:14px;display:flex;flex-direction:column;gap:11px;overflow:auto;max-height:min(70vh,660px)}
.insp .none{color:var(--ink-3);font-size:13px;line-height:1.7}
.insp .none b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink-2);margin-bottom:4px}
.insp .f{display:flex;flex-direction:column;gap:3px}
.insp label{font-size:11px;letter-spacing:.05em;color:var(--ink-2);font-weight:600}
.insp input,.insp select,.insp textarea{width:100%;font-size:13px}
.insp textarea{resize:vertical;min-height:48px}
.insp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp h3{font-family:var(--serif);font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.deplist{display:flex;flex-direction:column;gap:4px}
.deplist .d{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--surface-3);
  border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.deplist .d span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deplist .d button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.deplist .d button:hover{color:var(--late)}
.deplist .warn{color:var(--late);font-size:11.5px;font-weight:500}
.deplist .empty{color:var(--ink-3);font-size:12px}
.danger{border:1px solid var(--late);color:var(--late);background:var(--surface);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:12.5px}

/* 표 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:840px;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-3);position:sticky;top:0;z-index:1}
tbody tr:hover{background:var(--surface-3)}
td.date{font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
td .task-t{font-weight:600}
td .task-n{color:var(--ink-3);font-size:12px;margin-top:2px}
td .task-w{color:var(--late);font-size:12px;margin-top:3px;font-weight:500}
.rowact{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.todo{color:var(--todo)} .pill.doing{color:var(--doing)} .pill.done{color:var(--done)}
.pill.late{color:var(--late)} .pill.hold{color:var(--hold)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}

/* 부서별 */
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px}
.dept{border:1px solid var(--line);border-radius:3px;background:var(--surface-3);display:flex;flex-direction:column}
.dept > header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
.dept h3{font-family:var(--serif);font-size:16px;font-weight:700}
.dept .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.dept ul{list-style:none;margin:0;padding:4px 0;display:flex;flex-direction:column}
.dept li{padding:8px 13px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.dept li:last-child{border-bottom:0}
.dept li .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.dept li .nm{font-size:13px;font-weight:500;cursor:pointer;text-align:left;background:none;border:0;padding:0;flex:1}
.dept li .nm:hover{text-decoration:underline}
.dept li .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.empty{padding:44px 16px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px;font-family:var(--serif)}

.legend{display:flex;flex-wrap:wrap;gap:13px;align-items:center;font-size:12px;color:var(--ink-2);padding:9px 14px;border-top:1px solid var(--line)}
.legend .ph{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:2px}
dialog{border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,20,22,.55)}
dialog header{padding:13px 16px;border-bottom:1px solid var(--line)}
dialog h2{font-family:var(--serif);font-size:17px;font-weight:700}
dialog .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
dialog .body label{font-size:11.5px;color:var(--ink-2);font-weight:600;display:block;margin-bottom:3px}
dialog footer{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
footer.page{color:var(--ink-3);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px}

@media (max-width:960px){
  .board{grid-template-columns:1fr}
  .scroller{border-right:0;border-bottom:1px solid var(--line);max-height:56vh}
  .insp{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow">대학 통합 추진 협의체</p>
      <h1 id="boardTitle">통합 추진 일정판</h1>
      <p class="sub">빈 곳을 좌우로 끌면 그 기간에 과제가 생깁니다. 노드를 끌어 일정을 옮기고, 오른쪽 동그라미에서 다른 노드로 선을 이으면 선후관계가 걸립니다.</p>
    </div>
    <div class="dday">
      <div class="label">통합 개교 목표</div>
      <div class="count" id="ddayCount">—</div>
      <div class="date" id="ddayDate">목표일 미설정</div>
      <button type="button" id="setTarget">목표일 변경</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="추진 현황 요약"></section>
  <div class="note" id="syncNote" hidden></div>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="보기 전환">
      <button type="button" role="tab" id="tab-canvas" aria-selected="true" data-view="canvas">일정 캔버스</button>
      <button type="button" role="tab" id="tab-list" aria-selected="false" data-view="list">과제 목록</button>
      <button type="button" role="tab" id="tab-dept" aria-selected="false" data-view="dept">부서별</button>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="과제·담당자 검색" aria-label="과제·담당자 검색">
      <select id="fStatus" aria-label="상태 필터">
        <option value="">상태 전체</option>
        <option value="todo">예정</option><option value="doing">진행중</option>
        <option value="done">완료</option><option value="late">지연</option><option value="hold">보류</option>
      </select>
      <button type="button" class="btn ghost" id="csvBtn">CSV</button>
      <button type="button" class="btn" id="addBtn">일정 추가</button>
    </div>
  </div>

  <div class="chips" id="deptChips" aria-label="주관부서 필터"></div>

  <section class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">일정 캔버스</h2>
      <div class="tools">
        <span class="hint" id="panelHint"></span>
        <span class="zoom" id="zoomBox" role="group" aria-label="기간 배율"></span>
        <button type="button" class="btn ghost" id="tidyBtn">자동 정렬</button>
      </div>
    </div>
    <div id="viewHost"></div>
    <div class="legend" id="legend"></div>

function pd(s){ if(!s)return null; var p=String(s).split("-"); if(p.length<3)return null;
  var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return isNaN(d.getTime())?null:d; }

/* ---------- 저장 ---------- */
function localLoad(){
  try{
    tasks=JSON.parse(localStorage.getItem("um.tasks")||"[]");
    var m=JSON.parse(localStorage.getItem("um.meta")||"null"); if(m)meta=m;
  }catch(e){ tasks=[]; }
  if(!tasks.length){ tasks=clone(FALLBACK); meta=clone(FALLBACK_META); usingFallback=true; }
}
function localSave(){
  try{ localStorage.setItem("um.tasks",JSON.stringify(tasks)); localStorage.setItem("um.meta",JSON.stringify(meta)); }catch(e){}
}
function note(msg){ var n=$("#syncNote"); if(!msg){n.hidden=true;return;} n.textContent=msg; n.hidden=false; }

function boot(){
  buildStaticUI(); render();
  var use=(window.claude&&window.claude.use)?window.claude.use("db"):Promise.resolve(null);
  Promise.resolve(use).then(function(d){
    if(!d){ local=true; localLoad(); note(offlineMsg()); render(); return; }
    db=d;
    db.collection("tasks").onSnapshot(function(snap){
      tasks=snap.docs.map(function(s){ var o=s.data()||{}; o.id=s.id; return o; });
      note(""); render();
    }, function(e){
      local=true; localLoad();
      note(e&&e.code==="revoked" ? "저장소 접근 권한이 해제되어 읽기 전용으로 표시합니다." : offlineMsg());
      render();
    });
    db.doc("meta/board").onSnapshot(function(s){
      if(s.exists){ var v=s.data()||{}; meta={title:v.title||meta.title,target:v.target||""}; render(); }
    }, function(){});
  });
}
function offlineMsg(){
  return usingFallback
    ? "공유 저장에 연결하지 못해 기본 일정을 표시하고 있습니다. 여기서 고친 내용은 이 브라우저에만 남습니다."
    : "공유 저장을 쓸 수 없어 이 브라우저에만 저장됩니다. 다른 참석자에게는 보이지 않습니다.";
}
function persist(t){
  t.updatedAt=new Date().toISOString();
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  var body=clone(t); delete body.id;
  return db.collection("tasks").doc(t.id).set(body).catch(function(err){
    note(err&&err.code==="invalid_argument" ? "저장 권한이 없어 반영되지 않았습니다." : "저장에 실패했습니다.");
  });
}
function createTask(data){
  var id="t"+Date.now().toString(36)+Math.floor(Math.random()*900+100);
  data.id=id; data.updatedAt=new Date().toISOString();
  tasks.push(data);
  if(local||!db){ localSave(); render(); return Promise.resolve(id); }
  var body=clone(data); delete body.id;
  render();
  return db.collection("tasks").doc(id).set(body).then(function(){return id})
    .catch(function(){ note("저장에 실패했습니다."); return id; });
}
function removeTask(id){
  tasks=tasks.filter(function(t){return t.id!==id});
  tasks.forEach(function(t){ if(t.deps&&t.deps.indexOf(id)>=0){ t.deps=t.deps.filter(function(x){return x!==id}); persist(t); } });
  if(selId===id)selId=null;
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  render();
  return db.collection("tasks").doc(id).delete().catch(function(){ note("삭제에 실패했습니다."); });
}
function saveMeta(m){
  meta=m;
  if(local||!db){ localSave(); render(); return Promise.resolve(); }
  return db.doc("meta/board").set({title:m.title,target:m.target});
}

/* ---------- 파생 ---------- */
function byId(id){ for(var i=0;i<tasks.length;i++) if(tasks[i].id===id) return tasks[i]; return null; }
function depConflicts(t){
  if(!t||!t.deps||!t.deps.length) return [];
  var s=pd(t.start); if(!s) return [];
  return t.deps.map(byId).filter(function(d){ if(!d)return false; var e=pd(d.end); return e&&s<=e; });
}
function depNames(t){
  if(!t||!t.deps) return "";
  return t.deps.map(function(id){var d=byId(id);return d?d.title:null}).filter(Boolean).join(", ");
}
function effStatus(t){
  if(t.status==="done"||t.status==="hold")return t.status;
  var e=pd(t.end); if(e&&e<todayUTC())return "late";
  return t.status||"todo";
}
function phaseIdx(id){ var i=PHASES.findIndex(function(p){return p.id===id}); return i<0?PHASES.length:i; }
function phaseColor(id){ var i=phaseIdx(id); return "var(--p"+(Math.min(i,PHASES.length-1)+1)+")"; }
function allDepts(){ var s={}; BASE_DEPTS.forEach(function(d){s[d]=1}); tasks.forEach(function(t){if(t.dept)s[t.dept]=1}); return Object.keys(s); }
function activeDepts(){
  var s={}; tasks.forEach(function(t){ if(t.dept)s[t.dept]=(s[t.dept]||0)+1 });
  return Object.keys(s).sort(function(a,b){return s[b]-s[a]||a.localeCompare(b,"ko")}).map(function(d){return{name:d,count:s[d]}});
}
function visible(){
  var q=query.trim().toLowerCase();
  return tasks.filter(function(t){
    if(filterDepts.length&&filterDepts.indexOf(t.dept)<0)return false;
    if(filterStatus&&effStatus(t)!==filterStatus)return false;
    if(q&&[t.title,t.dept,t.owner,t.coop,t.deliverable,t.note].join(" ").toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){
    return phaseIdx(a.phase)-phaseIdx(b.phase) || String(a.start||"").localeCompare(String(b.start||""));
  });
}

/* 세로 위치가 없는 과제에 단계별로 겹치지 않는 자리를 계산해 준다. */
function layout(list,ppd){
  var LABEL_PX=178;
  var bands={}, y=PAD_TOP;
  PHASES.forEach(function(p){
    var rows=list.filter(function(t){return t.phase===p.id})
      .sort(function(a,b){return String(a.start||"").localeCompare(String(b.start||""))});
    if(!rows.length)return;
    var lanes=[];
    rows.forEach(function(t){
      var s=pd(t.start), e=pd(t.end)||s; if(!s){ t._y=y; return; }
      /* 막대가 좁으면 제목이 오른쪽 바깥에 붙으므로 그 폭만큼 자리를 더 잡는다. */
      var days=Math.round((e-s)/DAY)+1, occ=e.getTime();
      if(ppd && days*ppd < 118) occ += Math.round(LABEL_PX/ppd)*DAY;
      var i=0; for(;i<lanes.length;i++){ if(lanes[i] < s.getTime()) break; }
      if(i===lanes.length)lanes.push(0);
      lanes[i]=occ;
      t._y=y+i*(NODE_H+ROW_GAP);
    });
    bands[p.id]={top:y,rows:lanes.length};
    y+=lanes.length*(NODE_H+ROW_GAP)+BAND_GAP;
  });
  list.filter(function(t){return phaseIdx(t.phase)>=PHASES.length}).forEach(function(t,i){ t._y=y+i*(NODE_H+ROW_GAP); });
  return bands;
}

/* ---------- 기본 UI ---------- */
function buildStaticUI(){
  var lg=$("#legend");
  PHASES.forEach(function(p,i){
    var s=el("span","ph"), sw=el("span","sw"); sw.style.background="var(--p"+(i+1)+")";
    s.appendChild(sw); s.appendChild(el("span",null,p.short)); lg.appendChild(s);
  });
  var zb=$("#zoomBox");
  ZOOMS.forEach(function(z,i){
    var b=el("button",null,z.k); b.type="button"; b.setAttribute("aria-pressed",String(i===zoom));
    b.addEventListener("click",function(){ zoom=i; render(); }); zb.appendChild(b);
  });
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      view=b.dataset.view;
      document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",String(o===b))});
      render();
    });
  });
  $("#q").addEventListener("input",function(e){ query=e.target.value; render(); });
  $("#fStatus").addEventListener("change",function(e){ filterStatus=e.target.value; render(); });
  $("#addBtn").addEventListener("click",quickAdd);
  $("#csvBtn").addEventListener("click",exportCsv);
  $("#tidyBtn").addEventListener("click",tidy);
  $("#setTarget").addEventListener("click",function(){
    $("#f_boardTitle").value=meta.title||""; $("#f_target").value=meta.target||""; $("#targetDlg").showModal();
  });
  $("#tgCancel").addEventListener("click",function(){ $("#targetDlg").close(); });
  $("#targetForm").addEventListener("submit",function(){
    saveMeta({title:$("#f_boardTitle").value.trim()||"통합 추진 일정판",target:$("#f_target").value});
  });
  document.addEventListener("keydown",function(e){
    var tag=e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
    if(e.key==="Escape"){ selId=null; render(); }
    if((e.key==="Delete"||e.key==="Backspace")&&selId){
      e.preventDefault();
      var t=byId(selId);
      if(t&&confirm("‘"+t.title+"’을(를) 삭제합니다. 되돌릴 수 없습니다."))removeTask(selId);
    }
  });
}
function tidy(){
  tasks.forEach(function(t){ delete t.y; });
  layout(visible(),ZOOMS[zoom].ppd);
  tasks.forEach(function(t){ if(t._y!=null){ t.y=t._y; persist(t); } });
  render();
}
function quickAdd(){
  var s=todayUTC(), e=new Date(s.getTime()+13*DAY);
  createTask({title:"새 과제",phase:PHASES[0].id,dept:"",owner:"",start:ds(s),end:ds(e),
    status:"todo",coop:"",deliverable:"",note:"",deps:[]}).then(function(id){
      selId=id; view="canvas"; render();
      var i=document.querySelector(".insp #i_title"); if(i){ i.focus(); i.select(); }
    });
}

/* ---------- 렌더 ---------- */
function render(){
  $("#boardTitle").textContent=meta.title||"통합 추진 일정판";
  renderDday(); renderStats(); renderChips();
  var host=$("#viewHost"); host.textContent="";
  var list=visible();
  $("#panelTitle").textContent = view==="canvas"?"일정 캔버스":(view==="list"?"과제 목록":"부서별 분담");
  $("#panelHint").textContent = list.length+"건"+(tasks.length!==list.length?" / 전체 "+tasks.length:"");
  $("#legend").style.display = view==="canvas"?"":"none";
  $("#zoomBox").style.display = view==="canvas"?"":"none";
  $("#tidyBtn").style.display = view==="canvas"?"":"none";
  if(!tasks.length && view!=="canvas"){ host.appendChild(emptyBox("등록된 과제가 없습니다","‘일정 추가’를 누르거나 캔버스에서 기간을 끌어 만드세요.")); return; }
  if(!list.length && view!=="canvas"){ host.appendChild(emptyBox("조건에 맞는 과제가 없습니다","부서 칩이나 상태 필터를 해제해 보세요.")); return; }
  if(view==="canvas")host.appendChild(renderCanvas(list));
  else if(view==="list")host.appendChild(renderTable(list));
  else host.appendChild(renderDepts(list));
  var d=new Date();
  $("#stamp").textContent="v"+BUILD+" · "+(local?(usingFallback?"기본 일정":"로컬 저장"):"공유 저장")
    +" · "+d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")+" 기준";
}
function emptyBox(a,b){ var d=el("div","empty"); d.appendChild(el("strong",null,a)); d.appendChild(el("p",null,b)); return d; }
function renderDday(){
  var c=$("#ddayCount"), dt=$("#ddayDate"), t=pd(meta.target);
  if(!t){ c.textContent="—"; dt.textContent="목표일 미설정"; return; }
  var diff=Math.round((t-todayUTC())/DAY);
  c.textContent=diff>0?("D-"+diff):(diff===0?"D-DAY":("D+"+Math.abs(diff)));
  dt.textContent=fmt(meta.target);
}
function renderStats(){
  var box=$("#stats"); box.textContent="";
  var c={todo:0,doing:0,done:0,late:0,hold:0};
  tasks.forEach(function(t){ c[effStatus(t)]++ });
  [{n:tasks.length,t:"전체 과제",cls:""},
   {n:c.doing,t:"진행중",cls:"is-doing"},
   {n:c.late,t:"기한 초과",cls:"is-late"},
   {n:c.done,t:"완료",cls:"is-done"},
   {n:tasks.filter(function(t){return depConflicts(t).length}).length,t:"선후관계 충돌",cls:"is-warnk"},
   {n:activeDepts().length,t:"참여 부서",cls:""}
  ].forEach(function(i){
    var s=el("div","stat "+i.cls); s.appendChild(el("div","n",String(i.n))); s.appendChild(el("div","t",i.t)); box.appendChild(s);
  });
}
function renderChips(){
  var box=$("#deptChips"); box.textContent="";
  var all=el("button","chip","전체 부서"); all.type="button";
  all.setAttribute("aria-pressed",String(filterDepts.length===0));
  all.addEventListener("click",function(){ filterDepts=[]; render(); });
  box.appendChild(all);
  activeDepts().forEach(function(d){
    var b=el("button","chip",d.name+" "+d.count); b.type="button";
    b.setAttribute("aria-pressed",String(filterDepts.indexOf(d.name)>=0));
    b.addEventListener("click",function(){
      var i=filterDepts.indexOf(d.name); if(i>=0)filterDepts.splice(i,1); else filterDepts.push(d.name); render();
    });
    box.appendChild(b);
  });
}
function statusPill(t){
  var s=effStatus(t), p=el("span","pill "+s);
  p.appendChild(el("span","d")); p.appendChild(el("span",null,STATUS[s])); return p;
}

/* ---------- 일정 캔버스 ---------- */
function renderCanvas(list){
  var ppd=ZOOMS[zoom].ppd;
  var min=null,max=null;
  list.forEach(function(t){ var s=pd(t.start),e=pd(t.end)||pd(t.start);
    if(!s)return; if(!min||s<min)min=s; if(!max||!e||e>max)max=e||s; });
  var now=todayUTC();
  if(!min){ min=new Date(now.getTime()-30*DAY); max=new Date(now.getTime()+150*DAY); }
  if(min>now)min=now; if(max<now)max=now;
  var R0=new Date(Date.UTC(min.getUTCFullYear(),min.getUTCMonth(),1));
  R0=new Date(R0.getTime()-31*DAY); R0=new Date(Date.UTC(R0.getUTCFullYear(),R0.getUTCMonth(),1));
  var R1=new Date(Date.UTC(max.getUTCFullYear(),max.getUTCMonth()+3,0));
  var totalDays=Math.round((R1-R0)/DAY)+1;
  var W=Math.round(totalDays*ppd);
  var x=function(d){ return Math.round((d-R0)/DAY*ppd); };
  var dateAt=function(px){ return new Date(R0.getTime()+Math.round(px/ppd)*DAY); };
  var snap=function(d){ var k=Math.round((d-R0)/DAY/7)*7; return new Date(R0.getTime()+k*DAY); };

  layout(list,ppd);
  var H=PAD_TOP;
  list.forEach(function(t){ var y=(t.y!=null?t.y:t._y)||0; if(y+NODE_H>H)H=y+NODE_H; });
  H+=140;

  var board=el("div","board");
  var scroller=el("div","scroller");

  /* 눈금자 */
  var ruler=el("div","ruler"); ruler.style.width=W+"px";
  var cur=new Date(R0);
  while(cur<=R1){
    var lastD=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,0)).getUTCDate();
    var mo=el("div","mo"); mo.style.width=Math.round(lastD*ppd)+"px";
    if(cur.getUTCMonth()===0||cur.getTime()===R0.getTime())mo.appendChild(el("span","y",cur.getUTCFullYear()+"년"));
    mo.appendChild(document.createTextNode((cur.getUTCMonth()+1)+"월"));
    ruler.appendChild(mo);
    cur=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1));
  }
  scroller.appendChild(ruler);

  var surf=el("div","surface");
  surf.style.width=W+"px"; surf.style.height=H+"px";

  var grid=el("div","vgrid");
  cur=new Date(R0);
  while(cur<=R1){
    var g=el("i"); if(cur.getUTCMonth()%3===0)g.className="q";
    g.style.left=x(cur)+"px"; grid.appendChild(g);
    cur=new Date(Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1));
  }
  surf.appendChild(grid);

  if(now>=R0&&now<=R1){
    var nl=el("div","nowline"); nl.style.left=x(now)+"px"; nl.appendChild(el("b",null,"오늘")); surf.appendChild(nl);
  }

  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","edges"); svg.setAttribute("width",W); svg.setAttribute("height",H);
  var defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML='<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">'
    +'<path d="M0,0 L8,4 L0,8 z" fill="var(--edge)"/></marker>'
    +'<marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">'
    +'<path d="M0,0 L8,4 L0,8 z" fill="var(--late)"/></marker>';
  svg.appendChild(defs);
  surf.appendChild(svg);

  if(!list.length){
    var hint=el("div","drophint");
    hint.appendChild(el("b",null,"빈 곳을 좌우로 끌어 보세요"));
    hint.appendChild(document.createTextNode("끈 만큼이 그 과제의 기간이 됩니다"));
    surf.appendChild(hint);
  }

  /* 노드 */
  var nodeOf={};
  list.forEach(function(t){
    var s=pd(t.start), e=pd(t.end)||s; if(!s)return;
    var y=(t.y!=null?t.y:t._y)||PAD_TOP;
    var left=x(s), w=Math.max(14,x(new Date(e.getTime()+DAY))-left);
    var cf=depConflicts(t);
    var n=el("div","node st-"+effStatus(t)+(cf.length?" bad":"")+(selId===t.id?" sel":"")+(w<118?" slim":""));
    n.dataset.id=t.id; n.style.left=left+"px"; n.style.top=y+"px"; n.style.width=w+"px";
    n.style.background=phaseColor(t.phase);
    n.tabIndex=0;
    n.title=(t.dept||"부서 미정")+" · "+fmt(t.start)+" ~ "+fmt(t.end)+" · "+STATUS[effStatus(t)]
      +(depNames(t)?"\n선행: "+depNames(t):"")+(cf.length?"\n⚠ 선행 ‘"+cf[0].title+"’ 종료 전 시작":"");
    if(w>=118){
      n.appendChild(el("div","t",t.title||"(제목 없음)"));
      n.appendChild(el("div","m",(t.dept||"부서 미정")+(t.owner?" · "+t.owner:"")));
    }
    n.appendChild(el("div","hL")); n.appendChild(el("div","hR"));
    var lk=el("div","link"); lk.title="여기서 끌어 다른 과제에 놓으면 선행관계가 걸립니다"; n.appendChild(lk);
    surf.appendChild(n);
    nodeOf[t.id]={x:left,w:w,y:y};
    if(w<118){
      var out=el("div","tagout"); out.style.left=(left+w+8)+"px"; out.style.top=y+"px";
      out.appendChild(el("b",null,t.title||"(제목 없음)"));
      out.appendChild(el("span",null,(t.dept||"부서 미정")+(t.owner?" · "+t.owner:"")));
      surf.appendChild(out);
    }
  });

  /* 선행관계 선 */
  list.forEach(function(t){
    if(!t.deps)return;
    var to=nodeOf[t.id]; if(!to)return;
    t.deps.forEach(function(pid){
      var fr=nodeOf[pid]; if(!fr)return;
      var src=byId(pid), bad=false;
      if(src){ var se=pd(src.end), ts=pd(t.start); bad=!!(se&&ts&&ts<=se); }
      var x1=fr.x+fr.w, y1=fr.y+NODE_H/2, x2=to.x, y2=to.y+NODE_H/2;
      var dx=Math.max(26,Math.abs(x2-x1)/2);
      var p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("class","e"+(bad?" bad":""));
      p.setAttribute("d","M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2);
      p.setAttribute("marker-end",bad?"url(#ahb)":"url(#ah)");
      var tt=document.createElementNS("http://www.w3.org/2000/svg","title");
      tt.textContent=(src?src.title:"?")+" → "+t.title+(bad?"  ⚠ 선행 종료 전 시작":"")+"  (클릭하면 끊김)";
      p.appendChild(tt);
      p.addEventListener("click",function(ev){
        ev.stopPropagation();
        t.deps=t.deps.filter(function(v){return v!==pid}); persist(t);
      });
      svg.appendChild(p);
    });
  });

  bindCanvas(surf,svg,{x:x,dateAt:dateAt,snap:snap,ppd:ppd,R0:R0,W:W});
  scroller.appendChild(surf);
  board.appendChild(scroller);
  board.appendChild(renderInspector());

  if(!scrolledOnce){
    scrolledOnce=true;
    requestAnimationFrame(function(){ scroller.scrollLeft=Math.max(0,x(now)-260); });
  }
  return board;
}

/* ---------- 캔버스 조작 ---------- */
function bindCanvas(surf,svg,S){
  var drag=null;

  function localPt(ev){
    var r=surf.getBoundingClientRect();
    return {x:ev.clientX-r.left, y:ev.clientY-r.top};
  }
  function snapY(v){ return Math.max(0,Math.round(v/8)*8); }
  /* 먼 과제로 선을 끌 때 캔버스 가장자리에서 자동으로 스크롤한다. */
  function autoScroll(ev){
    var sc=surf.parentNode, r=sc.getBoundingClientRect(), M=56;
    if(ev.clientX>r.right-M)sc.scrollLeft+=14;
    else if(ev.clientX<r.left+M)sc.scrollLeft-=14;
    if(ev.clientY>r.bottom-M)sc.scrollTop+=10;
    else if(ev.clientY<r.top+M+30)sc.scrollTop-=10;
  }

  surf.addEventListener("pointerdown",function(ev){
    if(ev.button!==0)return;
    /* 캔버스 밖에서 손을 뗀 이전 드래그의 잔여물을 치운다. */
    surf.querySelectorAll(".newspan").forEach(function(g){g.remove()});
    svg.querySelectorAll("path.tmp").forEach(function(g){g.remove()});
    var node=ev.target.closest?ev.target.closest(".node"):null;
    var pt=localPt(ev);

    if(ev.target.classList&&ev.target.classList.contains("link")&&node){
      drag={mode:"link",from:node.dataset.id,path:null};
      var p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("class","tmp"); svg.appendChild(p); drag.path=p;
      drag.ox=parseFloat(node.style.left)+parseFloat(node.style.width);
      drag.oy=parseFloat(node.style.top)+NODE_H/2;
      surf.setPointerCapture(ev.pointerId); ev.preventDefault(); return;
    }
    if(node){
      var t=byId(node.dataset.id); if(!t)return;
      selId=t.id;
      var cls=ev.target.classList;
      var mode = cls&&cls.contains("hL") ? "resizeL" : (cls&&cls.contains("hR") ? "resizeR" : "move");
      drag={mode:mode,id:t.id,node:node,startX:pt.x,startY:pt.y,
            ox:parseFloat(node.style.left),oy:parseFloat(node.style.top),ow:parseFloat(node.style.width)};
      node.classList.add("sel");
      surf.setPointerCapture(ev.pointerId); ev.preventDefault();
      renderInspectorInto();
      return;
    }
    /* 빈 곳에서 끌기 → 새 과제 */
    selId=null; renderInspectorInto();
    drag={mode:"create",startX:pt.x,startY:pt.y,ghost:null};
    surf.setPointerCapture(ev.pointerId);
  });

  surf.addEventListener("pointermove",function(ev){
    if(!drag)return;
    var pt=localPt(ev);
    if(drag.mode==="create"){
      var a=Math.min(drag.startX,pt.x), b=Math.max(drag.startX,pt.x);
      if(b-a<6&&!drag.ghost)return;
      if(!drag.ghost){ drag.ghost=el("div","newspan"); surf.appendChild(drag.ghost); }
      var d1=S.snap(S.dateAt(a)), d2=S.snap(S.dateAt(b));
      if(d2<=d1)d2=new Date(d1.getTime()+7*DAY);
      drag.d1=d1; drag.d2=new Date(d2.getTime()-DAY);
      drag.ghost.style.left=S.x(d1)+"px"; drag.ghost.style.width=(S.x(d2)-S.x(d1))+"px";
      drag.ghost.style.top=snapY(drag.startY-NODE_H/2)+"px";
      drag.ghost.textContent=fmt(dsx(d1))+" ~ "+fmt(dsx(drag.d2));
      return;
    }
    if(drag.mode==="link"){
      autoScroll(ev);
      var x1=drag.ox,y1=drag.oy,x2=pt.x,y2=pt.y,dx=Math.max(26,Math.abs(x2-x1)/2);
      drag.path.setAttribute("d","M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2);
      return;
    }
    var n=drag.node;
    if(drag.mode==="move"){
      n.style.left=(drag.ox+(pt.x-drag.startX))+"px";
      n.style.top=snapY(drag.oy+(pt.y-drag.startY))+"px";
    }else if(drag.mode==="resizeR"){
      n.style.width=Math.max(14,drag.ow+(pt.x-drag.startX))+"px";
    }else{
      var dxm=pt.x-drag.startX, nw=Math.max(14,drag.ow-dxm);
      n.style.left=(drag.ox+(drag.ow-nw))+"px"; n.style.width=nw+"px";
    }
  });

  function finish(ev){
    if(!drag)return;
    var d=drag; drag=null;
    try{ surf.releasePointerCapture(ev.pointerId); }catch(e){}

    if(d.mode==="create"){
      if(d.ghost){
        var top=parseFloat(d.ghost.style.top);
        d.ghost.remove();
        createTask({title:"새 과제",phase:guessPhase(d.d1),dept:"",owner:"",
          start:dsx(d.d1),end:dsx(d.d2),status:"todo",coop:"",deliverable:"",note:"",deps:[],y:top})
          .then(function(id){
            selId=id; render();
            var i=document.querySelector(".insp #i_title"); if(i){ i.focus(); i.select(); }
          });
      }else{ render(); }
      return;
    }
    if(d.mode==="link"){
      d.path.remove();
      var tgt=document.elementFromPoint(ev.clientX,ev.clientY);
      var tn=tgt&&tgt.closest?tgt.closest(".node"):null;
      if(tn&&tn.dataset.id&&tn.dataset.id!==d.from){
        var t=byId(tn.dataset.id);
        if(t){
          t.deps=t.deps||[];
          if(t.deps.indexOf(d.from)<0 && !makesCycle(t.id,d.from)){ t.deps.push(d.from); persist(t); }
          else if(makesCycle(t.id,d.from)) note("서로 선행이 되는 순환 관계는 만들 수 없습니다.");
          else render();
        }
      }else render();
      return;
    }
    var t2=byId(d.id); if(!t2){ render(); return; }
    var n=d.node;
    var nl=parseFloat(n.style.left), nw=parseFloat(n.style.width), nt=parseFloat(n.style.top);
    var s=S.snap(S.dateAt(nl)), e=S.snap(S.dateAt(nl+nw));
    if(e<=s)e=new Date(s.getTime()+7*DAY);
    t2.start=dsx(s); t2.end=dsx(new Date(e.getTime()-DAY));
    if(d.mode==="move")t2.y=nt;
    persist(t2);
  }
  surf.addEventListener("pointerup",finish);
  surf.addEventListener("pointercancel",finish);
  surf.addEventListener("dblclick",function(ev){
    var n=ev.target.closest?ev.target.closest(".node"):null;
    if(n){ selId=n.dataset.id; render(); var i=document.querySelector(".insp #i_title"); if(i)i.focus(); }
  });
}
function dsx(d){ return ds(d); }
function guessPhase(d){
  var best=PHASES[0].id, bd=Infinity;
  tasks.forEach(function(t){
    var s=pd(t.start); if(!s)return;
    var diff=Math.abs(s-d); if(diff<bd){ bd=diff; best=t.phase||best; }
  });
  return best;
}
function makesCycle(targetId,newDepId){
  var seen={}, stack=[newDepId];
  while(stack.length){
    var cur=stack.pop();
    if(cur===targetId)return true;
    if(seen[cur])continue; seen[cur]=1;
    var t=byId(cur); if(t&&t.deps)t.deps.forEach(function(d){stack.push(d)});
  }
  return false;
}

/* ---------- 인스펙터 ---------- */
function renderInspectorInto(){
  var old=document.querySelector(".insp");
  if(old&&old.parentNode)old.parentNode.replaceChild(renderInspector(),old);
}
function renderInspector(){
  var box=el("div","insp");
  var t=selId?byId(selId):null;
  if(!t){
    var n=el("div","none");
    n.appendChild(el("b",null,"과제를 선택하세요"));
    n.appendChild(document.createTextNode("캔버스에서 노드를 누르면 여기서 부서·담당자·상태를 고칠 수 있습니다. 빈 곳을 좌우로 끌면 새 과제가 생기고, 노드 오른쪽 동그라미에서 다른 노드로 끌면 선행관계가 걸립니다."));
    box.appendChild(n); return box;
  }
  box.appendChild(el("h3",null,"과제 상세"));

  function field(label,id,node){
    var f=el("div","f"); var l=el("label",null,label); l.setAttribute("for",id); f.appendChild(l); f.appendChild(node); return f;
  }
  function commit(k,v){ t[k]=v; persist(t); }

  var ti=el("input"); ti.type="text"; ti.id="i_title"; ti.value=esc(t.title);
  ti.addEventListener("change",function(){ commit("title",ti.value.trim()||"(제목 없음)"); });
  box.appendChild(field("과제명","i_title",ti));

  var ph=el("select"); ph.id="i_phase";
  PHASES.forEach(function(p){ var o=el("option",null,p.name); o.value=p.id; if(p.id===t.phase)o.selected=true; ph.appendChild(o); });
  ph.addEventListener("change",function(){ commit("phase",ph.value); });
  box.appendChild(field("추진 단계","i_phase",ph));

  var two=el("div","two");
  var dp=el("input"); dp.type="text"; dp.id="i_dept"; dp.setAttribute("list","deptList"); dp.value=esc(t.dept);
  dp.addEventListener("change",function(){ commit("dept",dp.value.trim()); });
  two.appendChild(field("주관부서","i_dept",dp));
  var ow=el("input"); ow.type="text"; ow.id="i_owner"; ow.value=esc(t.owner);
  ow.addEventListener("change",function(){ commit("owner",ow.value.trim()); });
  two.appendChild(field("담당자","i_owner",ow));
  box.appendChild(two);

  var dl=el("datalist"); dl.id="deptList";
  allDepts().forEach(function(d){ var o=document.createElement("option"); o.value=d; dl.appendChild(o); });
  box.appendChild(dl);

  var two2=el("div","two");
  var sd=el("input"); sd.type="date"; sd.id="i_start"; sd.value=esc(t.start);
  sd.addEventListener("change",function(){ if(sd.value){ commit("start",sd.value); } });
  two2.appendChild(field("시작일","i_start",sd));
  var ed=el("input"); ed.type="date"; ed.id="i_end"; ed.value=esc(t.end);
  ed.addEventListener("change",function(){
    if(!ed.value)return;
    if(t.start&&ed.value<t.start){ note("종료일이 시작일보다 빠릅니다."); ed.value=t.end; return; }
    commit("end",ed.value);
  });
  two2.appendChild(field("종료일","i_end",ed));
  box.appendChild(two2);

  var st=el("select"); st.id="i_status";
  Object.keys(STATUS).forEach(function(k){
    if(k==="late")return;
    var o=el("option",null,STATUS[k]); o.value=k; if(k===(t.status||"todo"))o.selected=true; st.appendChild(o);
  });
  st.addEventListener("change",function(){ commit("status",st.value); });
  box.appendChild(field("상태","i_status",st));

  var cp=el("input"); cp.type="text"; cp.id="i_coop"; cp.value=esc(t.coop); cp.placeholder="쉼표로 구분";
  cp.addEventListener("change",function(){ commit("coop",cp.value.trim()); });
  box.appendChild(field("협조부서","i_coop",cp));

  var dv=el("input"); dv.type="text"; dv.id="i_deliv"; dv.value=esc(t.deliverable);
  dv.addEventListener("change",function(){ commit("deliverable",dv.value.trim()); });
  box.appendChild(field("산출물","i_deliv",dv));

  var nt=el("textarea"); nt.id="i_note"; nt.value=esc(t.note);
  nt.addEventListener("change",function(){ commit("note",nt.value.trim()); });
  box.appendChild(field("비고","i_note",nt));

  var dw=el("div","f");
  dw.appendChild(el("label",null,"선행과제"));
  var dlst=el("div","deplist");
  var cfIds=depConflicts(t).map(function(d){return d.id});
  if(!t.deps||!t.deps.length){
    dlst.appendChild(el("div","empty","없음 — 노드 오른쪽 동그라미에서 이 과제로 선을 끌어오면 걸립니다."));
  }else{
    t.deps.forEach(function(id){
      var d=byId(id); if(!d)return;
      var row=el("div","d");
      row.appendChild(el("span",null,d.title+" (종료 "+fmt(d.end)+")"));
      var x=el("button",null,"×"); x.type="button"; x.title="선행관계 끊기";
      x.addEventListener("click",function(){ t.deps=t.deps.filter(function(v){return v!==id}); persist(t); });
      row.appendChild(x); dlst.appendChild(row);
      if(cfIds.indexOf(id)>=0)dlst.appendChild(el("div","warn","⚠ 이 선행과제가 끝나기 전에 시작하도록 잡혀 있습니다"));
    });
  }
  var add=el("select"); add.id="i_addDep";
  var ph0=el("option",null,"＋ 선행과제 추가…"); ph0.value=""; add.appendChild(ph0);
  PHASES.forEach(function(p){
    var rows=tasks.filter(function(x){
      return x.phase===p.id && x.id!==t.id && (!t.deps||t.deps.indexOf(x.id)<0) && !makesCycle(t.id,x.id);
    }).sort(function(a,b){ return String(a.start||"").localeCompare(String(b.start||"")) });
    if(!rows.length)return;
    var g=document.createElement("optgroup"); g.label=p.name;
    rows.forEach(function(x){ var o=el("option",null,x.title+" (종료 "+fmt(x.end)+")"); o.value=x.id; g.appendChild(o); });
    add.appendChild(g);
  });
  add.addEventListener("change",function(){
    if(!add.value)return;
    t.deps=(t.deps||[]).concat([add.value]); persist(t);
  });
  dw.appendChild(dlst); dw.appendChild(add); box.appendChild(dw);

  var del=el("button","danger","이 과제 삭제"); del.type="button";
  del.addEventListener("click",function(){
    if(confirm("‘"+t.title+"’을(를) 삭제합니다. 되돌릴 수 없습니다."))removeTask(t.id);
  });
  box.appendChild(del);
  return box;
}

/* ---------- 표 ---------- */
function renderTable(list){
  var w=el("div","tbl-wrap"), tb=el("table"), head=el("thead"), hr=el("tr");
  ["단계","과제","주관부서","담당자","기간","상태",""].forEach(function(h){ hr.appendChild(el("th",null,h)); });
  head.appendChild(hr); tb.appendChild(head);
  var body=el("tbody");
  list.forEach(function(r){
    var tr=el("tr"), ph=PHASES.find(function(p){return p.id===r.phase});
    var c0=el("td"), tg=el("span","tag",ph?ph.name.split(" · ")[0]:"미지정");
    tg.style.color=ph?phaseColor(r.phase):""; c0.appendChild(tg); tr.appendChild(c0);
    var c1=el("td"); c1.appendChild(el("div","task-t",r.title||""));
    var sub=[]; if(r.deliverable)sub.push("산출물: "+r.deliverable); if(r.coop)sub.push("협조: "+r.coop);
    if(sub.length)c1.appendChild(el("div","task-n",sub.join("  ·  ")));
    var dn=depNames(r); if(dn)c1.appendChild(el("div","task-n","선행: "+dn));
    if(r.note)c1.appendChild(el("div","task-n",r.note));
    var cf=depConflicts(r);
    if(cf.length)c1.appendChild(el("div","task-w","⚠ 선행 ‘"+cf[0].title+"’ 종료("+fmt(cf[0].end)+") 전에 시작"
      +(cf.length>1?" 외 "+(cf.length-1)+"건":"")));
    tr.appendChild(c1);
    tr.appendChild(el("td",null,r.dept||"—"));
    tr.appendChild(el("td",null,r.owner||"—"));
    tr.appendChild(el("td","date",fmt(r.start)+" – "+fmt(r.end)));
    var c5=el("td"); c5.appendChild(statusPill(r)); tr.appendChild(c5);
    var c6=el("td"), b=el("button","rowact","캔버스에서 보기"); b.type="button";
    b.addEventListener("click",function(){
      selId=r.id; view="canvas";
      document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",String(o.dataset.view==="canvas"))});
      render();
    });
    c6.appendChild(b); tr.appendChild(c6);
    body.appendChild(tr);
  });
  tb.appendChild(body); w.appendChild(tb); return w;
}

/* ---------- 부서별 ---------- */
function renderDepts(list){
  var box=el("div","depts"), groups={};
  list.forEach(function(t){ var k=t.dept||"부서 미정"; (groups[k]=groups[k]||[]).push(t); });
  Object.keys(groups).sort(function(a,b){ return groups[b].length-groups[a].length||a.localeCompare(b,"ko") }).forEach(function(k){
    var rows=groups[k].slice().sort(function(a,b){ return String(a.start||"").localeCompare(String(b.start||"")) });
    var card=el("div","dept"), h=el("header");
    h.appendChild(el("h3",null,k));
    h.appendChild(el("span","cnt",rows.length+"건 · 미완 "+rows.filter(function(r){return effStatus(r)!=="done"}).length));
    card.appendChild(h);
    var ul=el("ul");
    rows.forEach(function(r){
      var li=el("li"), top=el("div","top"), nm=el("button","nm",r.title||""); nm.type="button";
      nm.addEventListener("click",function(){
        selId=r.id; view="canvas";
        document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",String(o.dataset.view==="canvas"))});
        render();
      });
      top.appendChild(nm); top.appendChild(statusPill(r)); li.appendChild(top);
      li.appendChild(el("div","meta",fmt(r.start)+" – "+fmt(r.end)+(r.owner?"  ·  "+r.owner:"")));
      ul.appendChild(li);
    });
    card.appendChild(ul); box.appendChild(card);
  });
  return box;
}

/* ---------- CSV ---------- */
function exportCsv(){
  var rows=[["단계","과제명","주관부서","협조부서","담당자","시작일","종료일","상태","선행과제","선후관계 충돌","산출물","비고"]];
  visible().forEach(function(t){
    var ph=PHASES.find(function(p){return p.id===t.phase});
    rows.push([ph?ph.name:"미지정",t.title||"",t.dept||"",t.coop||"",t.owner||"",t.start||"",t.end||"",
      STATUS[effStatus(t)],depNames(t),depConflicts(t).length?"충돌":"",t.deliverable||"",t.note||""]);
  });
  var csv="﻿"+rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"' }).join(",") }).join("\r\n");
  var name="통합추진일정_"+new Date().toISOString().slice(0,10)+".csv";
  var use=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
  Promise.resolve(use).then(function(d){
    if(!d){ note("이 화면에서는 파일 내려받기를 쓸 수 없습니다. 표 보기에서 복사해 주세요."); return; }
    return d.save({filename:name,data:csv});
  }).catch(function(){ note("내려받기가 취소되었거나 실패했습니다."); });
}
